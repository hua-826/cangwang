      async function askAI(rawText) {
        const q = (rawText || '').trim();
        if (!q) return;

        el.dockInput.value = '';
        el.sheetChatInput.value = '';
        el.dockInput.blur();
        el.sheetChatInput.blur();

        if (!getApiKey()) {
          toast('请先在设置中填写 DeepSeek API Key');
          openSettings();
          return;
        }

        el.chatMask.classList.add('open');
        const list = chatByCat[activeCat];
        list.push({ role: 'user', content: q });
        const aiMsg = { role: 'assistant', content: '正在理解你的意思并翻阅书架目录...', meta: '', done: false };
        list.push(aiMsg);
        renderChatSheet();
        const aiBubble = el.chatMessages.lastElementChild;

        if (chatAbort) chatAbort.abort();
        chatAbort = new AbortController();

        try {
          // 第一步：意图理解 + 错别字纠偏 + 目录规划
          const plan = await planQueryWithAI(q, activeCat);

          // 若用户明确问了另一个门类，自动切换到对应门类知识库（严格隔离，绝不串台）
          if (plan.category !== activeCat) {
            activeCat = plan.category;
            localStorage.setItem(LS.cat, activeCat);
            renderHome();
          }

          const cmdNotice = await runAgentCmd(plan.cmd);

          // 第二步：跨该门类全部书籍精准抓取原文
          const ret = retrieveFromCategory(plan);
          const catObj = getCat(plan.category);
          const metaParts = [];
          if (plan.corrected !== q) metaParts.push('已理解：' + plan.corrected.slice(0, 18));
          if (ret.bookCount > 0) metaParts.push('联合检索 ' + ret.bookCount + ' 本' + catObj.name + '古籍');
          if (cmdNotice) metaParts.push(cmdNotice);
          aiMsg.meta = metaParts.join(' · ');
          paintAiBubble(aiBubble, aiMsg);

          // 第三步：深度精读、跨书对照、按书断案与连续追问
          const curPageCtx = (currentBook && el.readerView.classList.contains('active') && currentBook.pages[currentPageIdx])
            ? '【用户当前屏幕正在看：《' + currentBook.title + '》第' + (currentPageIdx + 1) + '页】\n' + currentBook.pages[currentPageIdx].text + '\n\n'
            : '';

          const recentTurns = list.slice(-7, -2).map(m => ({ role: m.role, content: m.content }));

          const sysPrompt =
            '你是「藏往」书房的主控 AI 书童兼' + catObj.full + '私教。你极其聪明、通透、接地气，完全听得懂普通人的口语和错别字。\n\n' +
            '【核心原则】\n' +
            '1. 绝不敷衍说“查不到”：用户提问常带错别字或大白话，你必须结合下方提供的「' + catObj.name + '」全部相关典籍原文，主动拆解底层理法并综合推演。\n' +
            '2. 跨书合参与观点对照：当有多本书籍时，把各书的观点汇总或对比呈现；若用户发来真实卦例、命盘或户型，严格按书架里的原典铁律一步步拆解断案。\n' +
            '3. 出处格式规范：凡引用原书时，请严格写成《书名》第X页（例如：《增删卜易》第12页），系统会自动将其变成可点击直达原书的按钮。\n' +
            '4. 排版清爽：用最通俗的大白话讲透，小节可用【标题】分段，严禁使用任何星号符号。';

          const userMsg =
            curPageCtx +
            (ret.context ? '【从「' + catObj.name + '」书库检索到的原文】\n' + ret.context + '\n\n' : '') +
            '用户原话：' + q + (plan.corrected !== q ? '\n（系统纠偏理解：' + plan.corrected + '）' : '');

          const full = await callDeepSeek(
            [{ role: 'system', content: sysPrompt }, ...recentTurns, { role: 'user', content: userMsg }],
            {
              stream: true,
              signal: chatAbort.signal,
              onChunk: (partial) => {
                aiMsg.content = partial;
                paintAiBubble(aiBubble, aiMsg);
                el.chatMessages.scrollTop = el.chatMessages.scrollHeight;
              }
            }
          );

          aiMsg.content = full || cmdNotice || '已处理完成。';
          aiMsg.done = true;
          paintAiBubble(aiBubble, aiMsg);
          el.chatMessages.scrollTop = el.chatMessages.scrollHeight;
        } catch (e) {
          if (e.name === 'AbortError') return;
          aiMsg.content = '请求未完成：' + (e.message || '请检查网络或 API Key 后重试');
          aiMsg.done = true;
          paintAiBubble(aiBubble, aiMsg);
        }
      }

      // 免费语音听书
      function stopSpeak() {
        if ('speechSynthesis' in window) {
          try { window.speechSynthesis.cancel(); } catch (e) {}
        }
        isSpeaking = false;
        el.speakBtn.classList.remove('active');
        el.speakBtn.textContent = '听书';
      }

      function toggleSpeak() {
        if (!('speechSynthesis' in window)) { toast('当前浏览器不支持朗读'); return; }
        if (isSpeaking) { stopSpeak(); toast('已停止听书'); return; }
        if (!currentBook) return;
        const page = currentBook.pages[currentPageIdx];
        const txt = (Array.isArray(page.vernacular) && page.vernacular.length > 0) ? page.vernacular.join('。') : page.text;
        if (!txt.trim()) { toast('本页无文字可朗读'); return; }
        stopSpeak();
        const u = new SpeechSynthesisUtterance(txt);
        u.lang = 'zh-CN';
        u.rate = 0.96;
        u.onend = () => stopSpeak();
        u.onerror = () => stopSpeak();
        isSpeaking = true;
        el.speakBtn.classList.add('active');
        el.speakBtn.textContent = '停止';
        window.speechSynthesis.speak(u);
        toast('开始朗读第 ' + (currentPageIdx + 1) + ' 页');
      }

      // 设置与全库备份恢复
      function openSettings() {
        el.apiKeyInput.value = getApiKey();
        applyModelUI(getModel());
        const charsW = (allBooks.reduce((s, b) => s + (b.totalChars || 0), 0) / 10000).toFixed(1);
        el.backupStats.textContent = '本机共保存 ' + allBooks.length + ' 本古籍（约 ' + charsW + ' 万字）与 ' + allNotes.length + ' 条铁律摘录。';
        el.settingsMask.classList.add('open');
      }

      async function exportBackup() {
        const data = {
          app: 'CangwangPro',
          version: 4,
          exportedAt: new Date().toISOString(),
          settings: {
            skin: localStorage.getItem(LS.skin) || 'porcelain',
            paper: localStorage.getItem(LS.paper) || 'pure-white',
            font: localStorage.getItem(LS.font) || 'mixed',
            size: localStorage.getItem(LS.size) || '18',
            model: getModel()
          },
          books: allBooks,
          notes: allNotes
        };
        const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
        const a = document.createElement('a');
        const d = new Date().toISOString().slice(0, 10).replace(/-/g, '');
        a.href = URL.createObjectURL(blob);
        a.download = 'cangwang-backup-' + d + '.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        toast('备份文件已导出，请妥善保存');
      }

      async function importBackup(file) {
        try {
          const text = await file.text();
          const data = JSON.parse(text);
          if (!Array.isArray(data.books)) throw new Error('备份文件格式不正确');
          for (const b of data.books) await dbPut(ST_BOOKS, b);
          if (Array.isArray(data.notes)) {
            for (const n of data.notes) await dbPut(ST_NOTES, n);
          }
          allBooks = await dbGetAll(ST_BOOKS);
          allNotes = await dbGetAll(ST_NOTES);
          if (data.settings) {
            if (data.settings.skin) applySkin(data.settings.skin);
            if (data.settings.paper) applyPaper(data.settings.paper);
            if (data.settings.font) applyFont(data.settings.font);
            if (data.settings.size) applySize(data.settings.size);
          }
          renderHome();
          openSettings();
          toast('已成功恢复 ' + data.books.length + ' 本古籍与译文缓存');
        } catch (e) {
          toast('恢复失败：' + (e.message || '文件损坏'));
        } finally {
          el.backupInput.value = '';
        }
      }

      // 事件绑定
      el.addBookBtn.addEventListener('click', () => el.pdfInput.click());
      el.pdfInput.addEventListener('change', (e) => handleImport(e.target.files));

      [el.tabShelf, el.tabKb, el.tabNotes].forEach(btn => {
        btn.addEventListener('click', () => {
          homeSubTab = btn.dataset.sub;
          kbSelectedBookId = null;
          shelfEditing = false;
          renderHome();
        });
      });

      el.backHomeBtn.addEventListener('click', closeReader);

      el.modeModernBtn.addEventListener('click', () => {
        if (readMode === 'modern') return;
        readMode = 'modern';
        localStorage.setItem(LS.mode, readMode);
        applyReadModeUI();
        if (currentBook) renderReaderPage(currentBook, currentPageIdx, null);
      });

      el.modeDualBtn.addEventListener('click', () => {
        if (readMode === 'dual') return;
        readMode = 'dual';
        localStorage.setItem(LS.mode, readMode);
        applyReadModeUI();
        if (currentBook) renderReaderPage(currentBook, currentPageIdx, null);
      });

      el.openTocBtn.addEventListener('click', renderToc);
      el.closeTocBtn.addEventListener('click', () => el.tocMask.classList.remove('open'));
      el.tocMask.addEventListener('click', (e) => { if (e.target === el.tocMask) el.tocMask.classList.remove('open'); });

      el.togglePaperBarBtn.addEventListener('click', () => el.readerPaperBar.classList.toggle('open'));
      el.paperSwatchRow.querySelectorAll('.swatch').forEach(b => {
        b.addEventListener('click', () => applyPaper(b.dataset.paper));
      });
      el.readerFontBtn.addEventListener('click', openSettings);
      el.speakBtn.addEventListener('click', toggleSpeak);

      // 阅读器手势翻页与左右边缘轻点翻页
      let sx = 0, sy = 0, st = 0;
      el.readerStage.addEventListener('touchstart', (e) => {
        if (e.touches.length !== 1) return;
        sx = e.touches[0].clientX;
        sy = e.touches[0].clientY;
        st = Date.now();
      }, { passive: true });

      el.readerStage.addEventListener('touchend', (e) => {
        if (!currentBook || e.changedTouches.length !== 1) return;
        const sel = window.getSelection();
        if (sel && !sel.isCollapsed) return;
        const dx = e.changedTouches[0].clientX - sx;
        const dy = e.changedTouches[0].clientY - sy;
        if (Math.abs(dx) > 48 && Math.abs(dx) / 1.4 > Math.abs(dy) && Date.now() - st < 650) {
          turnPage(dx < 0 ? 1 : -1);
        }
      }, { passive: true });

      el.readerStage.addEventListener('click', (e) => {
        if (!currentBook) return;
        const sel = window.getSelection();
        if (sel && !sel.isCollapsed) return;
        const w = window.innerWidth;
        if (e.clientX < w / 6) turnPage(-1);
        else if (e.clientX > w - w / 6) turnPage(1);
      });

      // 划词响应
      document.addEventListener('selectionchange', () => {
        clearTimeout(document._st);
        document._st = setTimeout(() => {
          const sel = window.getSelection();
          if (!sel || sel.isCollapsed) { el.selFloat.classList.remove('show'); return; }
          const str = sel.toString().trim();
          if (str.length >= 2 && el.readerScroll.contains(sel.anchorNode)) {
            selectedSnippet = str.slice(0, 600);
            el.selFloat.classList.add('show');
          } else {
            el.selFloat.classList.remove('show');
          }
        }, 160);
      });

      el.selAskBtn.addEventListener('click', () => {
        const s = selectedSnippet;
        if (!s) return;
        el.selFloat.classList.remove('show');
        try { window.getSelection().removeAllRanges(); } catch (e) {}
        askAI('用大白话讲透这段话，并点出它的核心铁律与例外反转：\n「' + s + '」');
      });

      el.selNoteBtn.addEventListener('click', () => {
        const s = selectedSnippet;
        if (!s) return;
        el.selFloat.classList.remove('show');
        try { window.getSelection().removeAllRanges(); } catch (e) {}
        saveNote(s, currentBook ? currentBook.title : '', currentBook ? currentPageIdx + 1 : 0);
      });

      // 底部长条 AI 栏与对话抽屉
      el.openChatSheetBtn.addEventListener('click', () => {
        renderChatSheet();
        el.chatMask.classList.add('open');
      });
      el.dockSendBtn.addEventListener('click', () => askAI(el.dockInput.value));
      el.dockInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); askAI(el.dockInput.value); } });

      el.sheetChatSendBtn.addEventListener('click', () => askAI(el.sheetChatInput.value));
      el.sheetChatInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); askAI(el.sheetChatInput.value); } });

      el.quickChips.querySelectorAll('.quick-chip').forEach(c => {
        c.addEventListener('click', () => askAI(c.dataset.q));
      });

      el.clearChatBtn.addEventListener('click', () => {
        chatByCat[activeCat] = [];
        renderChatSheet();
        toast('对话已清空');
      });
      el.closeChatBtn.addEventListener('click', () => el.chatMask.classList.remove('open'));
      el.chatMask.addEventListener('click', (e) => { if (e.target === el.chatMask) el.chatMask.classList.remove('open'); });

      // 设置交互
      el.openSettingsBtn.addEventListener('click', openSettings);
      el.closeSettingsBtn.addEventListener('click', () => el.settingsMask.classList.remove('open'));
      el.settingsMask.addEventListener('click', (e) => { if (e.target === el.settingsMask) el.settingsMask.classList.remove('open'); });

      el.toggleKeyBtn.addEventListener('click', () => {
        const isPwd = el.apiKeyInput.type === 'password';
        el.apiKeyInput.type = isPwd ? 'text' : 'password';
        el.toggleKeyBtn.textContent = isPwd ? '隐藏' : '显示';
      });

      el.saveKeyBtn.addEventListener('click', () => {
        const v = el.apiKeyInput.value.trim();
        localStorage.setItem(LS.key, v);
        toast(v ? 'API Key 已永久保存' : 'API Key 已清空');
        if (v && currentBook && el.readerView.classList.contains('active')) {
          renderReaderPage(currentBook, currentPageIdx, null);
        }
      });

      el.modelSeg.querySelectorAll('.seg-item').forEach(b => {
        b.addEventListener('click', () => {
          localStorage.setItem(LS.model, b.dataset.model);
          applyModelUI(b.dataset.model);
          toast('已切换引擎：' + b.textContent);
        });
      });

      el.skinSeg.querySelectorAll('.seg-item').forEach(b => {
        b.addEventListener('click', () => applySkin(b.dataset.skin));
      });

      el.paperSeg.querySelectorAll('.seg-item').forEach(b => {
        b.addEventListener('click', () => applyPaper(b.dataset.paper));
      });

      el.fontSeg.querySelectorAll('.seg-item').forEach(b => {
        b.addEventListener('click', () => applyFont(b.dataset.font));
      });

      el.sizeSeg.querySelectorAll('.seg-item').forEach(b => {
        b.addEventListener('click', () => applySize(b.dataset.size));
      });

      el.exportBackupBtn.addEventListener('click', exportBackup);
      el.importBackupBtn.addEventListener('click', () => el.backupInput.click());
      el.backupInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) importBackup(e.target.files[0]);
      });

      // 启动初始化
      (async function boot() {
        applySkin(localStorage.getItem(LS.skin) || 'porcelain');
        applyPaper(localStorage.getItem(LS.paper) || 'pure-white');
        applyFont(localStorage.getItem(LS.font) || 'mixed');
        applySize(localStorage.getItem(LS.size) || '18');
        applyReadModeUI();
        try {
          allBooks = await dbGetAll(ST_BOOKS);
          allNotes = await dbGetAll(ST_NOTES);
        } catch (e) {
          allBooks = [];
          allNotes = [];
        }
        renderHome();
      })();
    })();
  </script>
</body>
</html>
