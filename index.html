<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="藏往" />
<meta name="theme-color" id="metaThemeColor" content="#F4F6F4" />
<link id="appleTouchIcon" rel="apple-touch-icon" sizes="512x512" href="" />
<link id="faviconLink" rel="icon" type="image/png" href="" />
<title>藏往 V8 · 极简术数与参悟终端</title>
<script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.6.12/lunar.js" defer></script>
<style>
:root {
  /* 默认：抹茶牛油果绿 + 曜石黑 + 极简纯白（现代清爽高级感） */
  --bg: #F4F6F4;
  --surface: #FFFFFF;
  --surface-2: #E8EDE8;
  --border: rgba(20, 28, 22, 0.07);
  --text: #161A17;
  --text-2: #636E66;
  --text-3: #909B93;
  --primary: #181D1A;
  --primary-fg: #FFFFFF;
  --accent: #4CAE44;
  --accent-deep: #2E7D32;
  --accent-soft: rgba(76, 174, 68, 0.13);
  --danger: #D94235;
  --btn-bg: #EEF2EE;
  --btn-fg: #1A211C;
  --dock-bg: rgba(255, 255, 255, 0.94);
  --shadow-sm: 0 4px 18px rgba(18, 30, 20, 0.045);
  --shadow-md: 0 14px 36px rgba(18, 30, 20, 0.11);
  --shadow-book: 0 12px 24px -6px rgba(0, 0, 0, 0.18), 0 2px 6px rgba(0, 0, 0, 0.06);
  --wx-wood: #288F59;
  --wx-fire: #D14334;
  --wx-earth: #A8742D;
  --wx-metal: #9C7D22;
  --wx-water: #2270B8;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --dock-space: 88px;
}

[data-theme="mono"] {
  /* 极简黑白灰高级感（参考极简黑白设计） */
  --bg: #F5F5F7;
  --surface: #FFFFFF;
  --surface-2: #EAEAEF;
  --border: rgba(0, 0, 0, 0.065);
  --text: #121214;
  --text-2: #68686E;
  --text-3: #95959D;
  --primary: #141416;
  --primary-fg: #FFFFFF;
  --accent: #141416;
  --accent-deep: #000000;
  --accent-soft: rgba(20, 20, 22, 0.08);
  --btn-bg: #F0F0F4;
  --btn-fg: #141416;
  --dock-bg: rgba(255, 255, 255, 0.95);
}

[data-theme="pine"] {
  /* 松烟黛青 + 朱砂点睛（东方书卷质感） */
  --bg: #F3F5F6;
  --surface: #FFFFFF;
  --surface-2: #E4E9EC;
  --border: rgba(26, 44, 52, 0.08);
  --text: #182830;
  --text-2: #5C6F78;
  --text-3: #8D9EA6;
  --primary: #1E353F;
  --primary-fg: #FFFFFF;
  --accent: #C23B2B;
  --accent-deep: #9B2C1F;
  --accent-soft: rgba(194, 59, 43, 0.11);
  --btn-bg: #EBF0F2;
  --btn-fg: #1E353F;
  --dock-bg: rgba(255, 255, 255, 0.95);
}

[data-theme="dark"] {
  /* 深空暗夜流光卡（参考暗黑流光卡片风） */
  --bg: #0D0F0E;
  --surface: #171B19;
  --surface-2: #222825;
  --border: rgba(255, 255, 255, 0.085);
  --text: #F2F5F3;
  --text-2: #9AA69E;
  --text-3: #68736C;
  --primary: #63C759;
  --primary-fg: #0B140C;
  --accent: #63C759;
  --accent-deep: #48A83E;
  --accent-soft: rgba(99, 199, 89, 0.16);
  --btn-bg: #222825;
  --btn-fg: #EDF2EE;
  --dock-bg: rgba(26, 31, 28, 0.94);
  --shadow-sm: 0 4px 18px rgba(0, 0, 0, 0.35);
  --shadow-md: 0 14px 36px rgba(0, 0, 0, 0.6);
  --wx-wood: #54D996;
  --wx-fire: #FF7161;
  --wx-earth: #E6B46A;
  --wx-metal: #E8C766;
  --wx-water: #63ADF2;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0; width: 100%; height: 100%;
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", sans-serif;
  font-size: 15.5px; -webkit-font-smoothing: antialiased;
  overflow: hidden;
  transition: background 0.25s var(--ease), color 0.25s var(--ease);
}

button, input, textarea, select { font-family: inherit; color: inherit; outline: none; }
button { border: none; background: none; cursor: pointer; transition: transform 0.14s var(--ease), background 0.18s var(--ease), opacity 0.18s var(--ease); }
button:active { transform: scale(0.96); }

.app-shell {
  position: relative; width: 100%; max-width: 560px; height: 100%; margin: 0 auto;
  display: flex; flex-direction: column; background: var(--bg); overflow: hidden;
}
.privacy-on .priv-blur { filter: blur(6px); user-select: none; pointer-events: none; }

/* 顶部状态栏纯色无缝实心垫层（彻底解决桌面全屏顶部发虚发灰） */
.top-header {
  padding: calc(var(--safe-top) + 10px) 18px 10px;
  background: var(--bg);
  z-index: 20; flex-shrink: 0;
}
.header-row { display: flex; align-items: center; justify-content: space-between; height: 42px; }
.header-left { display: flex; align-items: center; gap: 10px; }
.brand-name { font-size: 22px; font-weight: 700; letter-spacing: 0.02em; }
.brand-sub { font-size: 12.5px; color: var(--text-3); font-weight: 500; }
.overlay-title { font-size: 17px; font-weight: 600; }
.header-actions { display: flex; align-items: center; gap: 8px; }

/* 柴犬小吉祥物按钮 */
.shiba-badge {
  width: 38px; height: 38px; border-radius: 50%; background: var(--surface);
  box-shadow: var(--shadow-sm); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 2px;
}
.shiba-badge svg { width: 32px; height: 32px; }
.shiba-eye { transform-origin: center; animation: shibaBlink 4.6s infinite; }
@keyframes shibaBlink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(0.12); } }

.icon-btn {
  position: relative; width: 38px; height: 38px; border-radius: 50%;
  background: var(--surface); color: var(--text);
  box-shadow: var(--shadow-sm); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
}
.icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.backup-dot {
  position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent); border: 1.5px solid var(--surface); display: none;
}
.backup-dot.show { display: block; }

.btn-ghost { font-size: 15.5px; font-weight: 600; color: var(--accent-deep); padding: 6px 4px; }
[data-theme="dark"] .btn-ghost { color: var(--accent); }
.pill-mini {
  padding: 7px 13px; border-radius: 999px; font-size: 13px; font-weight: 600;
  background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm);
  border: 1px solid var(--border); white-space: nowrap;
}
.pill-mini.accent { background: var(--accent-soft); color: var(--accent-deep); border-color: transparent; box-shadow: none; }
[data-theme="dark"] .pill-mini.accent { color: var(--accent); }

/* 侧边抽屉 */
.drawer-backdrop {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.34); backdrop-filter: blur(5px);
  z-index: 90; opacity: 0; pointer-events: none; transition: opacity 0.25s var(--ease);
}
.drawer-backdrop.open { opacity: 1; pointer-events: auto; }
.side-drawer {
  position: fixed; top: 0; bottom: 0; left: 0; width: 292px; max-width: 82vw;
  background: var(--surface); z-index: 95; padding: calc(var(--safe-top) + 20px) 18px calc(var(--safe-bottom) + 24px);
  box-shadow: 16px 0 42px rgba(0, 0, 0, 0.14);
  transform: translateX(-105%); transition: transform 0.3s var(--ease);
  display: flex; flex-direction: column; overflow-y: auto;
}
.side-drawer.open { transform: translateX(0); }
.drawer-head { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
.drawer-brand { font-size: 21px; font-weight: 700; }
.drawer-sub { font-size: 12.5px; color: var(--text-3); margin-top: 2px; }
.drawer-section-lbl { font-size: 12px; font-weight: 600; color: var(--text-3); padding: 0 10px 8px; }
.drawer-menu { display: flex; flex-direction: column; gap: 6px; }
.drawer-item {
  display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-radius: 16px;
  font-size: 15.5px; font-weight: 500; color: var(--text); text-align: left; background: var(--bg);
}
.drawer-item:active { opacity: 0.78; }
.drawer-ico { width: 22px; height: 22px; color: var(--text-2); display: flex; align-items: center; justify-content: center; }
.drawer-ico svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.drawer-txt { flex: 1; }
.drawer-badge { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--surface); color: var(--text-2); }

/* 视图容器 */
.views-wrap { position: relative; flex: 1; overflow: hidden; z-index: 2; }
.view-page {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  opacity: 0; pointer-events: none; transform: translateY(6px);
  transition: opacity 0.22s var(--ease), transform 0.24s var(--ease);
}
.view-page.active { opacity: 1; pointer-events: auto; transform: translateY(0); }
.scroll-area {
  flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
  padding: 6px 18px calc(var(--dock-space) + var(--safe-bottom) + 22px);
}
.scroll-area::-webkit-scrollbar { display: none; }

/* 横向胶囊门类条 */
.cat-strip { display: flex; align-items: center; gap: 7px; overflow-x: auto; padding: 10px 0 4px; scrollbar-width: none; }
.cat-strip::-webkit-scrollbar { display: none; }
.cat-pill {
  flex: 0 0 auto; padding: 7px 15px; border-radius: 999px; font-size: 14.5px; font-weight: 500;
  color: var(--text-2); background: var(--surface); border: 1px solid var(--border);
}
.cat-pill.active {
  background: var(--primary); color: var(--primary-fg); border-color: transparent; font-weight: 600;
  box-shadow: 0 4px 12px rgba(20, 30, 22, 0.16);
}

/* 轻拟物分段胶囊控制器 */
.seg-wrap {
  margin-top: 10px; background: var(--surface-2); border-radius: 14px; padding: 4px;
  display: grid; grid-template-columns: repeat(3, 1fr); position: relative;
}
.seg-btn { position: relative; z-index: 2; padding: 8px 4px; font-size: 14px; font-weight: 500; color: var(--text-2); border-radius: 10px; text-align: center; }
.seg-btn.active { color: var(--text); font-weight: 600; }
.seg-slider {
  position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 8px) / 3);
  background: var(--surface); border-radius: 10.5px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
  transition: transform 0.26s var(--ease); z-index: 1;
}

/* 现代大圆角留白卡片与按钮 */
.card {
  background: var(--surface); border-radius: 24px; border: 1px solid var(--border);
  padding: 18px; box-shadow: var(--shadow-sm); margin-bottom: 14px;
}
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.card-title { font-size: 16.5px; font-weight: 700; color: var(--text); }
.chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 7px 13px; border-radius: 999px;
  font-size: 13px; font-weight: 500; background: var(--btn-bg); color: var(--btn-fg); white-space: nowrap;
}
.chip.accent { background: var(--accent-soft); color: var(--accent-deep); font-weight: 600; }
[data-theme="dark"] .chip.accent { color: var(--accent); }

.btn-primary {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 14px 20px;
  border-radius: 16px; background: var(--primary); color: var(--primary-fg); font-size: 15.5px; font-weight: 600;
  box-shadow: 0 6px 16px rgba(18, 28, 20, 0.14);
}
.btn-accent {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 14px 20px;
  border-radius: 16px; background: linear-gradient(135deg, var(--accent), var(--accent-deep));
  color: #FFFFFF; font-size: 15.5px; font-weight: 600;
  box-shadow: 0 8px 20px var(--accent-soft);
}
.btn-secondary {
  display: inline-flex; align-items: center; justify-content: center; gap: 5px; padding: 10px 14px;
  border-radius: 14px; background: var(--btn-bg); color: var(--btn-fg); font-size: 14px; font-weight: 500;
}
.empty-box { text-align: center; padding: 42px 20px; color: var(--text-3); }
.empty-box p { margin: 10px 0 16px; font-size: 14.5px; line-height: 1.68; }

/* 清爽苹果表单行 */
.form-row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 0; border-bottom: 1px solid var(--border);
}
.form-row:last-child { border-bottom: none; padding-bottom: 2px; }
.form-row:first-child { padding-top: 2px; }
.form-row-lbl { font-size: 15px; font-weight: 600; color: var(--text); flex-shrink: 0; min-width: 74px; }
.form-row-val { flex: 1; display: flex; justify-content: flex-end; align-items: center; gap: 8px; }
.inline-input {
  width: 100%; border: none; background: transparent; text-align: right; font-size: 15px; color: var(--text);
}
.inline-input::placeholder { color: var(--text-3); }

.gender-pill { display: inline-flex; background: var(--btn-bg); border-radius: 999px; padding: 3px; }
.gender-pill button { padding: 5px 15px; border-radius: 999px; font-size: 13.5px; color: var(--text-2); }
.gender-pill button.active { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }

/* 精致高清矢量铜钱与蓄力摇卦区 */
.coins-stage { display: flex; justify-content: center; gap: 18px; padding: 16px 0 10px; }
.coin-wrap { display: flex; flex-direction: column; align-items: center; gap: 7px; }
.coin-svg { width: 72px; height: 72px; filter: drop-shadow(0 6px 12px rgba(96, 68, 22, 0.22)); transition: transform 0.25s var(--ease); }
.coin-wrap.shaking .coin-svg { animation: coinSpinShake 0.28s linear infinite; }
.coin-wrap.settled .coin-svg { animation: coinLand 0.36s var(--ease); }
.coin-lbl { font-size: 12.5px; color: var(--text-2); font-weight: 500; }
@keyframes coinSpinShake {
  0% { transform: translateY(0) rotateY(0deg) rotateZ(-6deg); }
  50% { transform: translateY(-12px) rotateY(180deg) rotateZ(6deg); }
  100% { transform: translateY(0) rotateY(360deg) rotateZ(-6deg); }
}
@keyframes coinLand {
  0% { transform: scale(1.12) translateY(-8px); }
  65% { transform: scale(0.96) translateY(2px); }
  100% { transform: scale(1) translateY(0); }
}

.hold-cast-pad {
  width: 100%; padding: 16px; border-radius: 18px;
  background: linear-gradient(135deg, var(--accent), var(--accent-deep));
  color: #FFFFFF; font-size: 16px; font-weight: 600; text-align: center;
  user-select: none; -webkit-user-select: none; touch-action: none;
  box-shadow: 0 8px 22px var(--accent-soft);
  transition: transform 0.16s var(--ease), filter 0.2s;
}
.hold-cast-pad.holding { transform: scale(0.975); filter: brightness(0.9); }

/* 六爻指定 6 行选择框与 4 选 1 居中弹窗 */
.spec-yao-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.spec-yao-lbl { width: 48px; font-size: 15px; font-weight: 500; color: var(--text-2); text-align: right; flex-shrink: 0; }
.spec-yao-btn {
  flex: 1; height: 46px; padding: 0 14px; border-radius: 14px;
  border: 1px solid var(--border); background: var(--bg);
  display: flex; align-items: center; justify-content: space-between; font-size: 14.5px;
}
.center-modal-backdrop {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(5px);
  z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px;
  opacity: 0; pointer-events: none; transition: opacity 0.2s;
}
.center-modal-backdrop.open { opacity: 1; pointer-events: auto; }
.center-modal-card {
  width: 100%; max-width: 340px; background: var(--surface); border-radius: 24px;
  padding: 20px; box-shadow: var(--shadow-md);
  transform: scale(0.94); transition: transform 0.22s var(--ease);
}
.center-modal-backdrop.open .center-modal-card { transform: scale(1); }
.yao-pick-list { display: flex; flex-direction: column; gap: 10px; }
.yao-pick-opt {
  display: flex; align-items: center; gap: 14px; padding: 13px 16px; border-radius: 14px;
  border: 1px solid var(--border); background: var(--bg); width: 100%;
}
.yao-pick-lbl { font-size: 15.5px; font-weight: 600; width: 42px; text-align: left; }
.yao-pick-bar { flex: 1; height: 11px; display: flex; justify-content: space-between; }
.yao-pick-bar.yang { background: var(--text); border-radius: 3px; }
.yao-pick-bar.yin::before, .yao-pick-bar.yin::after { content: ""; width: 43%; height: 100%; background: var(--text); border-radius: 3px; }
.yao-pick-mark { width: 22px; font-size: 19px; font-weight: 700; color: var(--accent-deep); text-align: center; }

/* 排盘结果与五行色彩 */
.gz-banner {
  background: var(--primary); color: var(--primary-fg); text-align: center; padding: 11px 12px;
  border-radius: 14px; font-size: 14.5px; font-weight: 600; letter-spacing: 0.03em; margin: 10px 0;
}
.ly-row {
  display: grid; grid-template-columns: 38px 52px 1fr 22px 1fr; align-items: center; gap: 5px;
  padding: 9px 6px; border-bottom: 1px dashed var(--border); font-size: 13.5px; cursor: pointer;
}
.ly-row:last-child { border-bottom: none; }
.ly-row.yongshen { background: var(--accent-soft); border-radius: 10px; }
.yao-svg { width: 40px; height: 9px; display: inline-flex; justify-content: space-between; vertical-align: middle; margin-right: 4px; }
.yao-svg.yang { background: var(--text); border-radius: 2px; }
.yao-svg.yin::before, .yao-svg.yin::after { content: ""; width: 43%; height: 100%; background: var(--text); border-radius: 2px; }
.yao-svg.mov.yang, .yao-svg.mov.yin::before, .yao-svg.mov.yin::after { background: var(--danger); }
.wx-木 { color: var(--wx-wood); } .wx-火 { color: var(--wx-fire); } .wx-土 { color: var(--wx-earth); } .wx-金 { color: var(--wx-metal); } .wx-水 { color: var(--wx-water); }

/* 书架 */
.books-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px 14px; padding-top: 6px; }
.book-item { display: flex; flex-direction: column; cursor: pointer; }
.book-cover {
  position: relative; width: 100%; aspect-ratio: 2 / 2.82; border-radius: 6px 14px 14px 6px;
  box-shadow: var(--shadow-book); overflow: hidden; display: flex; flex-direction: column;
  justify-content: space-between; padding: 12px 10px 10px 14px;
}
.book-cover::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 7px;
  background: linear-gradient(90deg, rgba(0,0,0,0.22), rgba(255,255,255,0.16) 55%, rgba(0,0,0,0.06));
}
.book-cover-title { font-size: 13.5px; font-weight: 700; line-height: 1.38; color: #FFF; position: relative; z-index: 2; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.book-cover-foot { position: relative; z-index: 2; display: flex; justify-content: space-between; font-size: 10px; color: rgba(255,255,255,0.85); }
.reading-badge { position: absolute; top: 6px; right: 6px; z-index: 3; padding: 2px 7px; border-radius: 999px; font-size: 9.5px; font-weight: 600; background: var(--accent); color: #FFF; }
.book-meta { margin-top: 8px; display: flex; justify-content: space-between; align-items: flex-start; gap: 3px; }
.book-name { font-size: 13.5px; font-weight: 600; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.book-list-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--surface); border-radius: 18px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); margin-bottom: 10px; cursor: pointer; }
.book-mini-cover { width: 46px; height: 64px; border-radius: 6px 10px 10px 6px; flex-shrink: 0; padding: 5px; color: #FFF; font-size: 10px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-align: center; }

/* 备忘录编辑器 */
.note-toolbar { display: flex; align-items: center; gap: 7px; overflow-x: auto; padding: 9px 14px; background: var(--surface); border-bottom: 1px solid var(--border); }
.note-paper { flex: 1; display: flex; flex-direction: column; padding: 18px; background: var(--surface); overflow-y: auto; }
.note-title-input { width: 100%; border: none; background: transparent; font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 12px; }
.note-body-input { flex: 1; width: 100%; border: none; background: transparent; font-size: 16px; line-height: 1.78; color: var(--text); resize: none; min-height: 360px; }

/* 万年历与九宫格 */
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.cal-wk { font-size: 12px; color: var(--text-3); padding: 4px 0; }
.cal-cell { position: relative; padding: 6px 2px 7px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; cursor: pointer; min-height: 56px; }
.cal-cell.other { opacity: 0.28; }
.cal-cell.selected { background: var(--primary); color: var(--primary-fg); }
.cal-cell.today:not(.selected) { background: var(--accent-soft); }
.cal-cell.good-match:not(.selected) { box-shadow: inset 0 0 0 1.5px var(--accent); }
.cal-day-num { font-size: 15px; font-weight: 600; }
.cal-sub { font-size: 10px; opacity: 0.85; white-space: nowrap; overflow: hidden; max-width: 100%; }
.cal-sub.jieqi { color: var(--accent-deep); font-weight: 600; }
.cal-cell.selected .cal-sub.jieqi { color: var(--primary-fg); }
.cal-dots { display: flex; gap: 3px; margin-top: 2px; height: 5px; }
.dot-study { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
.dot-flag { width: 4px; height: 4px; border-radius: 50%; background: var(--danger); }

.pillars-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; margin-top: 10px; }
.pillar-col { background: var(--bg); border-radius: 16px; padding: 11px 5px; }
.pillar-lbl { font-size: 11.5px; color: var(--text-3); margin-bottom: 4px; }
.pillar-gz { font-size: 21px; font-weight: 700; line-height: 1.25; }
.nine-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-top: 8px; }
.nine-cell { background: var(--bg); border-radius: 14px; padding: 9px 6px; text-align: center; font-size: 12.5px; line-height: 1.45; }
.qimen-cell { background: var(--bg); border-radius: 14px; padding: 8px 6px; font-size: 11.5px; line-height: 1.45; display: flex; flex-direction: column; justify-content: space-between; min-height: 92px; }
.qimen-row { display: flex; justify-content: space-between; align-items: center; }

/* 断法双栏字典 */
.dict-layout { display: grid; grid-template-columns: 104px 1fr; gap: 10px; min-height: 64vh; }
.dict-left { background: var(--surface); border-radius: 20px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); overflow-y: auto; max-height: 68vh; padding: 6px; }
.dict-nav-item { padding: 10px 8px; font-size: 13.5px; color: var(--text-2); border-radius: 12px; cursor: pointer; text-align: center; margin-bottom: 3px; }
.dict-nav-item.active { background: var(--primary); color: var(--primary-fg); font-weight: 600; }
.dict-right { background: var(--surface); border-radius: 20px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); padding: 16px; overflow-y: auto; max-height: 68vh; }

/* 参悟聊天室 */
.chat-wrap { flex: 1; position: relative; display: flex; flex-direction: column; overflow: hidden; }
.chat-messages { flex: 1; overflow-y: auto; padding: 12px 18px 18px; -webkit-overflow-scrolling: touch; }
.msg-row { margin-bottom: 14px; display: flex; flex-direction: column; }
.msg-row.user { align-items: flex-end; }
.msg-row.ai { align-items: flex-start; }
.msg-bubble { max-width: 90%; padding: 13px 16px; border-radius: 20px; font-size: 15px; line-height: 1.7; word-break: break-word; }
.msg-row.user .msg-bubble { background: var(--primary); color: var(--primary-fg); border-bottom-right-radius: 6px; }
.msg-row.ai .msg-bubble { background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-sm); border-bottom-left-radius: 6px; }
.msg-bubble strong { font-weight: 700; background: linear-gradient(transparent 68%, var(--accent-soft) 68%); padding: 0 2px; }
.ref-jump { display: inline-flex; padding: 2px 8px; margin: 0 2px; border-radius: 8px; font-size: 13px; font-weight: 600; background: var(--accent-soft); color: var(--accent-deep); cursor: pointer; }
.msg-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
.msg-act-btn { padding: 5px 11px; border-radius: 999px; font-size: 12px; background: var(--btn-bg); color: var(--text-2); }
.scroll-latest-btn { position: absolute; right: 18px; bottom: 162px; padding: 8px 14px; border-radius: 999px; background: var(--primary); color: var(--primary-fg); font-size: 13px; font-weight: 600; box-shadow: var(--shadow-md); opacity: 0; pointer-events: none; transition: all 0.2s; z-index: 15; }
.scroll-latest-btn.show { opacity: 1; pointer-events: auto; }
.chat-input-bar { padding: 10px 14px calc(var(--dock-space) + var(--safe-bottom) + 6px); background: var(--bg); display: flex; align-items: flex-end; gap: 8px; }
.chat-input { flex: 1; min-height: 42px; max-height: 112px; padding: 10px 15px; border-radius: 22px; border: 1px solid var(--border); background: var(--surface); font-size: 15px; line-height: 1.4; resize: none; box-shadow: var(--shadow-sm); }
.send-btn { width: 42px; height: 42px; border-radius: 50%; background: var(--primary); color: var(--primary-fg); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

/* 底部悬浮胶囊导航底座（参考图 1 & 图 4 现代高级感） */
.bottom-nav-wrap {
  position: fixed; bottom: calc(var(--safe-bottom) + 12px); left: 50%; transform: translateX(-50%);
  width: calc(100% - 32px); max-width: 520px; z-index: 30; pointer-events: none;
}
.bottom-nav {
  pointer-events: auto; height: 64px; padding: 6px 8px;
  background: var(--dock-bg); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
  border-radius: 999px; border: 1px solid var(--border);
  box-shadow: 0 12px 34px rgba(16, 24, 18, 0.11);
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
}
.nav-item {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  border-radius: 999px; color: var(--text-2); font-size: 13.5px; font-weight: 500;
  transition: all 0.24s var(--ease);
}
.nav-item svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.nav-item.active {
  background: var(--primary); color: var(--primary-fg); font-weight: 600;
  box-shadow: 0 4px 14px rgba(18, 28, 20, 0.18);
}

/* 全屏浮层与双引擎阅读器 */
.overlay-page { position: fixed; inset: 0; max-width: 560px; margin: 0 auto; background: var(--bg); z-index: 60; display: flex; flex-direction: column; transform: translateX(100%); transition: transform 0.3s var(--ease); pointer-events: none; }
.overlay-page.open { transform: translateX(0); pointer-events: auto; }

.reader-shell { --r-bg: #F6F1E5; --r-fg: #2A241E; --r-muted: #7C7265; --r-bar: #F6F1E5; background: var(--r-bg); color: var(--r-fg); }
.reader-shell[data-paper="white"] { --r-bg: #FFFFFF; --r-fg: #1C1C1E; --r-muted: #7E7E85; --r-bar: #FFFFFF; }
.reader-shell[data-paper="gray"]  { --r-bg: #F0F1F4; --r-fg: #23262B; --r-muted: #727780; --r-bar: #F0F1F4; }
.reader-shell[data-paper="green"] { --r-bg: #E3EDE5; --r-fg: #1F3025; --r-muted: #5F7566; --r-bar: #E3EDE5; }
.reader-shell[data-paper="night"] { --r-bg: #0D0E0E; --r-fg: #C6CCC8; --r-muted: #6C746E; --r-bar: #121413; }
.reader-shell[data-paper="warm"] #pdfCanvas { filter: sepia(0.14); }
.reader-shell[data-paper="night"] #pdfCanvas { filter: invert(0.90) hue-rotate(180deg); }

.reader-topbar, .reader-botbar { position: absolute; left: 0; right: 0; background: var(--r-bar); z-index: 20; transition: transform 0.25s var(--ease), opacity 0.22s; }
.reader-topbar { top: 0; padding: calc(var(--safe-top) + 10px) 14px 10px; border-bottom: 1px solid rgba(128,128,128,0.16); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.reader-botbar { bottom: 0; padding: 12px 14px calc(var(--safe-bottom) + 14px); border-top: 1px solid rgba(128,128,128,0.16); }
.reader-shell.bars-hidden .reader-topbar { transform: translateY(-110%); opacity: 0; pointer-events: none; }
.reader-shell.bars-hidden .reader-botbar { transform: translateY(110%); opacity: 0; pointer-events: none; }
.reader-content-wrap { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: calc(var(--safe-top) + 64px) 18px calc(var(--safe-bottom) + 72px); }
.reader-para { margin: 0 0 1em; text-align: justify; border-radius: 8px; padding: 3px 5px; }
.reader-modern-block { margin: -0.35em 0 1.25em; padding: 11px 14px; border-left: 3px solid var(--accent); background: rgba(128,128,128,0.08); border-radius: 0 12px 12px 0; font-size: 0.96em; line-height: 1.82; }
.reader-mode-bar { display: inline-flex; background: rgba(128,128,128,0.14); border-radius: 999px; padding: 3px; gap: 2px; }
.reader-mode-bar button { padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; color: inherit; opacity: 0.72; }
.reader-mode-bar button.active { background: var(--primary); color: var(--primary-fg); opacity: 1; }
.reader-mini-foot { position: fixed; bottom: calc(var(--safe-bottom) + 8px); left: 18px; right: 18px; max-width: 524px; margin: 0 auto; display: flex; justify-content: space-between; font-size: 11.5px; color: var(--r-muted); pointer-events: none; z-index: 5; }
.reader-fab { position: absolute; right: 16px; bottom: calc(var(--safe-bottom) + 28px); padding: 9px 15px; border-radius: 999px; background: var(--primary); color: var(--primary-fg); font-size: 13px; font-weight: 600; box-shadow: var(--shadow-md); z-index: 15; }
.sel-popover { position: fixed; bottom: calc(var(--safe-bottom) + 86px); left: 50%; transform: translateX(-50%); background: var(--primary); color: var(--primary-fg); border-radius: 999px; padding: 6px 10px; display: none; align-items: center; gap: 7px; box-shadow: var(--shadow-md); z-index: 75; }
.sel-popover.show { display: flex; }
.sel-popover button { color: inherit; padding: 5px 10px; border-radius: 999px; background: rgba(255,255,255,0.16); font-size: 13px; }

/* 底部抽屉与表单 */
.sheet-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.38); z-index: 105; opacity: 0; pointer-events: none; transition: opacity 0.22s; display: flex; align-items: flex-end; justify-content: center; }
.sheet-backdrop.open { opacity: 1; pointer-events: auto; }
.sheet-panel { width: 100%; max-width: 560px; max-height: 86vh; background: var(--surface); color: var(--text); border-radius: 26px 26px 0 0; padding: 12px 18px calc(var(--safe-bottom) + 24px); overflow-y: auto; transform: translateY(100%); transition: transform 0.28s var(--ease); }
.sheet-backdrop.open .sheet-panel { transform: translateY(0); }
.sheet-handle { width: 40px; height: 4px; border-radius: 999px; background: var(--border); margin: 0 auto 14px; }
.form-field { margin-bottom: 12px; }
.form-label { display: block; font-size: 13px; font-weight: 600; color: var(--text-2); margin-bottom: 6px; }
.form-input, .form-textarea, .form-select { width: 100%; padding: 11px 14px; border-radius: 14px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 15px; }
.form-textarea { min-height: 84px; resize: vertical; line-height: 1.55; }
.paper-dot { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--border); }

.hex-mini-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.hex-card-item { background: var(--surface); border-radius: 18px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); padding: 13px; display: flex; align-items: center; gap: 10px; cursor: pointer; }
.hex-mini-lines { width: 28px; display: flex; flex-direction: column; gap: 3px; flex-shrink: 0; }
.yao-bar { height: 3.5px; width: 100%; border-radius: 2px; display: flex; justify-content: space-between; }
.yao-bar.yang { background: var(--text); }
.yao-bar.yin::before, .yao-bar.yin::after { content: ""; width: 42%; height: 100%; border-radius: 2px; background: var(--text); }

.toast { position: fixed; top: calc(var(--safe-top) + 18px); left: 50%; transform: translate(-50%, -18px); background: var(--primary); color: var(--primary-fg); padding: 11px 18px; border-radius: 999px; font-size: 14px; font-weight: 500; box-shadow: var(--shadow-md); opacity: 0; pointer-events: none; z-index: 140; transition: all 0.24s var(--ease); max-width: 88vw; text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="app-shell" id="appShell">

  <!-- 左侧极简侧边抽屉（精简至核心实用功能） -->
  <div class="drawer-backdrop" id="sideDrawerBackdrop" onclick="closeSideDrawer()"></div>
  <aside class="side-drawer" id="sideDrawer">
    <div class="drawer-head">
      <div class="shiba-badge" style="width:48px;height:48px;" id="drawerShibaSlot"></div>
      <div style="flex:1;">
        <div class="drawer-brand">藏往</div>
        <div class="drawer-sub" id="drawerRankText">初窥境 · 私人术数终端</div>
      </div>
      <button class="icon-btn" onclick="closeSideDrawer()" aria-label="关闭">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>

    <div class="drawer-section-lbl">核心收纳</div>
    <div class="drawer-menu">
      <button class="drawer-item" onclick="closeSideDrawer();openArchivesOverlay()">
        <span class="drawer-ico"><svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg></span>
        <span class="drawer-txt">实战档案库</span>
        <span class="drawer-badge" id="drawerArchCount">0</span>
      </button>
      <button class="drawer-item" onclick="closeSideDrawer();openGlobalSearch()">
        <span class="drawer-ico"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></span>
        <span class="drawer-txt">全库秒搜</span>
      </button>
    </div>

    <div class="drawer-section-lbl" style="margin-top:20px;">外观与数据安全</div>
    <div class="drawer-menu">
      <button class="drawer-item" onclick="togglePrivacyBlur()">
        <span class="drawer-ico"><svg viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle></svg></span>
        <span class="drawer-txt">一键隐私模糊</span>
        <span class="drawer-badge" id="drawerPrivState">关</span>
      </button>
      <button class="drawer-item" onclick="closeSideDrawer();openSettings()">
        <span class="drawer-ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.85 1 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></span>
        <span class="drawer-txt">主题 · 密钥 · 云同步</span>
      </button>
    </div>
  </aside>

  <div class="views-wrap">
    <!-- 1. 排盘主视图 -->
    <section class="view-page active" id="view-divine">
      <header class="top-header">
        <div class="header-row">
          <div class="header-left">
            <button class="icon-btn" onclick="openSideDrawer()" aria-label="菜单">
              <svg viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="17" x2="14" y2="17"></line></svg>
              <span class="backup-dot" id="backupDot"></span>
            </button>
            <span class="brand-name">藏往</span>
          </div>
          <div class="header-actions">
            <button class="pill-mini" onclick="openArchivesOverlay()">档案</button>
            <button class="icon-btn" onclick="openGlobalSearch()" aria-label="搜索">
              <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </button>
            <button class="shiba-badge" id="shibaMascotBtn" onclick="tapShibaMascot()" title="点柴犬看今日干支"></button>
          </div>
        </div>
        <div class="cat-strip" id="catStrip"></div>
        <div class="seg-wrap">
          <div class="seg-slider" id="subTabSlider"></div>
          <button class="seg-btn active" data-sub="cast" onclick="switchSubTab('cast')">起卦排盘</button>
          <button class="seg-btn" data-sub="shelf" onclick="switchSubTab('shelf')">藏书阁</button>
          <button class="seg-btn" data-sub="notes" id="notesTabLabel" onclick="switchSubTab('notes')">六爻笔记</button>
        </div>
      </header>
      <div class="scroll-area" id="divineScrollArea"></div>
    </section>

    <!-- 2. 干支历 -->
    <section class="view-page" id="view-calendar">
      <header class="top-header">
        <div class="header-row">
          <div class="header-left">
            <button class="icon-btn" onclick="openSideDrawer()"><svg viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="17" x2="14" y2="17"></line></svg></button>
            <span class="brand-name">干支历</span>
          </div>
          <div class="header-actions">
            <button class="pill-mini" onclick="openCalJumpSheet()">选年月</button>
            <button class="pill-mini accent" onclick="calGoToday()">今日</button>
          </div>
        </div>
      </header>
      <div class="scroll-area" id="calendarScrollArea"></div>
    </section>

    <!-- 3. 断法易库（40+ 干货 + AI 扩充专题 + 六十四卦，已砍观星与摇签） -->
    <section class="view-page" id="view-methods">
      <header class="top-header">
        <div class="header-row">
          <div class="header-left">
            <button class="icon-btn" onclick="openSideDrawer()"><svg viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="17" x2="14" y2="17"></line></svg></button>
            <span class="brand-name">断法易库</span>
          </div>
          <div class="header-actions">
            <button class="pill-mini accent" onclick="openSheet('sheet-ai-dict')">+ AI 扩充专题</button>
          </div>
        </div>
        <div class="seg-wrap" style="grid-template-columns:repeat(2,1fr);margin-top:10px;">
          <div class="seg-slider" id="methodsSlider" style="width:calc((100% - 8px)/2);"></div>
          <button class="seg-btn active" data-msub="dict" onclick="switchMethodsSub('dict')">断法宝典</button>
          <button class="seg-btn" data-msub="hex" onclick="switchMethodsSub('hex')">六十四卦</button>
        </div>
      </header>
      <div class="scroll-area" id="methodsScrollArea"></div>
    </section>

    <!-- 4. 参悟七大分舱 -->
    <section class="view-page" id="view-canwu">
      <header class="top-header">
        <div class="header-row">
          <div class="header-left">
            <button class="icon-btn" onclick="openSideDrawer()"><svg viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="17" x2="14" y2="17"></line></svg></button>
            <span class="brand-name">参悟</span>
            <span class="brand-sub" id="canwuHeaderSub">六爻舱</span>
          </div>
          <div class="header-actions">
            <button class="pill-mini" id="modeToggleBtn" onclick="toggleCanwuMode()">解答</button>
            <button class="pill-mini" onclick="openThreadDrawer()">话题</button>
            <button class="pill-mini accent" onclick="openBrainModal()">大脑</button>
            <button class="icon-btn" onclick="startNewChatThread()" title="新话题">
              <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
          </div>
        </div>
        <div class="cat-strip" id="canwuRoomStrip"></div>
      </header>
      <div class="chat-wrap">
        <div class="chat-messages" id="chatMessages"></div>
        <button class="scroll-latest-btn" id="scrollLatestBtn" onclick="scrollChatToBottom(true)">↓ 最新</button>
        <div class="chat-input-bar">
          <button class="icon-btn" onclick="startVoiceInput('chatInput')" title="语音输入">

// ==================== 2. IndexedDB（沿用 V6 库名，升级零丢书）与音效引擎 ====================
const DB_NAME = 'CangwangV6DB';
const DB_VER = 1;
let dbInst = null, preparedBackupBlob = null, preparedBackupName = '', audioCtx = null;
const STORES = ['books','pdfBlobs','chapters','notes','archives','chats','memories','hexCache','dailyDraws','footprints','meta'];

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      STORES.forEach(s => { if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: 'id' }); });
    };
    req.onsuccess = e => { dbInst = e.target.result; resolve(dbInst); };
    req.onerror = e => reject(e.target.error);
  });
}
function dbGet(s, id) { return new Promise((res, rej) => { const r = dbInst.transaction(s,'readonly').objectStore(s).get(id); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
function dbGetAll(s) { return new Promise((res, rej) => { const r = dbInst.transaction(s,'readonly').objectStore(s).getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error); }); }
function dbPut(s, o) { return new Promise((res, rej) => { const r = dbInst.transaction(s,'readwrite').objectStore(s).put(o); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
function dbDel(s, id) { return new Promise((res, rej) => { const r = dbInst.transaction(s,'readwrite').objectStore(s).delete(id); r.onsuccess = () => res(); r.onerror = () => rej(r.error); }); }

function playCoinClink(isSettle = false) {
  if (state.settings.coinSound === false) return;
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  if (!audioCtx) audioCtx = new AC();
  if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  const now = audioCtx.currentTime;
  const freqs = isSettle ? [2650, 3920, 5240] : [2200 + Math.random() * 600, 3400 + Math.random() * 700];
  freqs.forEach((f, idx) => {
    const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
    osc.type = idx === 0 ? 'triangle' : 'sine';
    osc.frequency.setValueAtTime(f, now);
    osc.frequency.exponentialRampToValueAtTime(f * 0.94, now + (isSettle ? 0.28 : 0.09));
    g.gain.setValueAtTime(isSettle ? 0.14 : 0.08, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + (isSettle ? 0.30 : 0.10));
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(now + idx * 0.012); osc.stop(now + (isSettle ? 0.32 : 0.12));
  });
}

// ====== 上半部分// ==================== 3. AES-256 端到端加密与云同步 ====================
async function deriveAesKey(pass, salt) {
  const bk = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' }, bk, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
function bytesToB64(b) { let s = ''; for (let i = 0; i < b.length; i++) s += String.fromCharCode(b[i]); return btoa(s); }
function b64ToBytes(b64) { const bin = atob(b64), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }

async function encryptPayload(jsonStr, pass) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveAesKey(pass, salt);
  const cipher = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(jsonStr));
  return JSON.stringify({ e2e: 'AES-256-GCM', s: bytesToB64(salt), iv: bytesToB64(iv), d: bytesToB64(new Uint8Array(cipher)) });
}
async function decryptPayload(wrappedStr, pass) {
  const obj = JSON.parse(wrappedStr); if (!obj.e2e) return obj;
  const key = await deriveAesKey(pass, b64ToBytes(obj.s));
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBytes(obj.iv) }, key, b64ToBytes(obj.d));
  return JSON.parse(new TextDecoder().decode(plain));
}

async function buildTextVaultPayload() {
  return {
    version: 'CangwangV8', exportedAt: new Date().toISOString(),
    books: await dbGetAll('books'), chapters: await dbGetAll('chapters'), notes: await dbGetAll('notes'),
    archives: await dbGetAll('archives'), chats: await dbGetAll('chats'), memories: await dbGetAll('memories'),
    hexCache: await dbGetAll('hexCache'), footprints: await dbGetAll('footprints'),
    settingsLite: { theme: state.settings.theme, groups: state.settings.groups, myDayPillar: state.settings.myDayPillar, customDict: state.customDict }
  };
}
async function applyTextVaultPayload(data) {
  if (!data || !Array.isArray(data.archives)) throw new Error('数据格式不匹配');
  for (const st of ['books','chapters','notes','archives','chats','memories','hexCache','footprints']) {
    if (Array.isArray(data[st])) for (const it of data[st]) await dbPut(st, it);
  }
  if (data.settingsLite) {
    if (Array.isArray(data.settingsLite.customDict)) { state.customDict = data.settingsLite.customDict; await dbPut('meta', { id: 'customDict', data: state.customDict }); }
    Object.assign(state.settings, data.settingsLite); await saveSettingsMeta();
  }
  await loadAllFromDB(); applyVisualTheme(); renderAllCurrentViews();
}

async function pushToCloudD1() {
  saveGeneralSettings(true);
  const { syncUrl, vaultPass, e2eEncrypt } = state.settings;
  if (!syncUrl || !vaultPass) return showToast('请先填写 Worker 地址和口令');
  showToast('正在加密上传云端...');
  try {
    let bodyStr = JSON.stringify(await buildTextVaultPayload());
    if (e2eEncrypt) bodyStr = await encryptPayload(bodyStr, vaultPass);
    const resp = await fetch(syncUrl.replace(/\/$/, '') + '/sync', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Vault-Token': vaultPass }, body: JSON.stringify({ payload: bodyStr }) });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    state.settings.dirtySinceBackup = false; state.settings.lastSyncAt = new Date().toLocaleString();
    document.getElementById('backupDot')?.classList.remove('show');
    await saveSettingsMeta();
    document.getElementById('cloudSyncStatus').textContent = '上次同步：' + state.settings.lastSyncAt;
    showToast('已同步至 Cloudflare D1');
  } catch (e) { showToast('云同步失败：' + e.message); }
}

async function pullFromCloudD1() {
  saveGeneralSettings(true);
  const { syncUrl, vaultPass } = state.settings;
  if (!syncUrl || !vaultPass) return showToast('请先填写 Worker 地址和口令');
  showToast('正在从云端拉回解密...');
  try {
    const resp = await fetch(syncUrl.replace(/\/$/, '') + '/sync', { method: 'GET', headers: { 'X-Vault-Token': vaultPass } });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const res = await resp.json();
    if (!res.payload) return showToast('云端暂无备份');
    await applyTextVaultPayload(await decryptPayload(res.payload, vaultPass));
    closeSheet('sheet-settings'); showToast('已从云端完整恢复全部资料');
  } catch (e) { showToast('拉回失败（请检查口令）：' + e.message); }
}

async function runSafeClearCache() {
  const days = Number(state.settings.chatRetentionDays);
  let removed = 0;
  if (days !== 0) {
    const cutoff = Date.now() - days * 86400000;
    const expired = state.chats.filter(t => !t.starred && (t.updatedAt || t.createdAt) < cutoff);
    for (const t of expired) { await dbDel('chats', t.id); removed++; }
    state.chats = state.chats.filter(t => t.starred || (t.updatedAt || t.createdAt) >= cutoff);
  }
  if (state.reader.pdfDoc) { try { state.reader.pdfDoc.destroy(); } catch (e) {} state.reader.pdfDoc = null; }
  await refreshStorageStats(); showToast(`已清理临时缓存与 ${removed} 条过期闲聊，书籍与档案零损失`);
}

    for (let g = 0; g < 8; g++) {
      if (g >= 1 && g <= 5) bits[g - 1] ^= 1;
      else if (g === 6) bits[3] ^= 1;
      else if (g === 7) { bits[0] = p & 1; bits[1] = (p >> 1) & 1; bits[2] = (p >> 2) & 1; }
      const lower = bits[0] + (bits[1] << 1) + (bits[2] << 2), upper = bits[3] + (bits[4] << 1) + (bits[5] << 2);
      const key = upper + '_' + lower, meta = HEX_DICT[key] || [0, '未知卦', ''];

})();

function runLiuyaoPhysicalExam(mainHex, movingSet, monthBranch, dayBranch, xunkong) {

    if (xunkong.includes(ln.branch)) tags.push('旬空');
    if (isMov && bLn) {

      else { const bRel = getWxRelation(bLn.wx, ln.wx); if (bRel === '生') tags.push('回头生'); else if (bRel === '克') tags.push('回头克'); if (LIU_CHONG[ln.branch] === bLn.branch) tags.push('反吟冲'); if (LIU_HE[ln.branch] === bLn.branch) tags.push('化合'); }

async function handleBookFileSelect(e) {

      await dbPut('pdfBlobs', { id: bookId, data: buf });

      await dbPut('books', book); state.books.push(book);
      for (let p = 1; p <= Math.min(pdf.numPages, 500); p++) {
        const page = await pdf.getPage(p), tc = await page.getTextContent();
        const txt = tc.items.map(it => it.str).join(' ').replace(/\s{2,}/g, '\n');
        const ch = { id: uid('ch'), bookId, idx: p - 1, pageNum: p, title: `第 ${p} 页`, content: txt, modernText: '' };

async function importPlainTextBook(title, rawText) {
  const clean = rawText.replace(/\r\n/g, '\n').trim();
  const re = /(?:^|\n)\s*((?:第[零一二三四五六七八九十百千0-9]+[章节卷篇回]|卷[零一二三四五六七八九十0-9]+)\s+[^\n]{1,34})(?=\n)/g;
  const hits = []; let m; while ((m = re.exec(clean)) !== null) hits.push({ title: m[1].trim(), index: m.index });
  const parts = [];
  if (hits.length >= 2) {
    if (hits[0].index > 80) parts.push({ title: '卷首 / 序言', content: clean.slice(0, hits[0].index).trim() });
    for (let i = 0; i < hits.length; i++) parts.push({ title: hits[i].title, content: clean.slice(hits[i].index, i + 1 < hits.length ? hits[i+1].index : clean.length).trim() });
  } else { for (let i = 0; i < clean.length; i += 2200) parts.push({ title: `第 ${parts.length + 1} 节`, content: clean.slice(i, i + 2200).trim() }); }
  const bookId = uid('bk');
  const book = { id: bookId, title: title || '自录典籍', category: state.category, hasPdf: false, totalPages: parts.length, lastPageNum: 1, toc: parts.map((p,i)=>({title:p.title,pageNum:i+1})), coverIdx: state.books.length % COVER_PALETTES.length, createdAt: Date.now(), lastReadAt: 0 };
  await dbPut('books', book); state.books.push(book);
  for (let i = 0; i < parts.length; i++) { const ch = { id: uid('ch'), bookId, idx: i, pageNum: i + 1, title: parts[i].title, content: parts[i].content, modernText: '' }; await dbPut('chapters', ch); state.chapters.push(ch); }
  await markDirty(); closeSheet('sheet-import'); renderDivineView(); showToast(`已导入《${book.title}》`);
}

async function renderReaderPage() {

}

function getMergedDict() {
  const merged = JSON.parse(JSON.stringify(BASE_DICT));
  (state.customDict || []).forEach(it => {
    const g = it.group || '自扩专题';
    if (!merged[g]) merged[g] = [];
    merged[g].unshift({ name: it.name, content: it.content, customId: it.id });
  });
  return merged;
}

async function generateAndSaveDictTopic() {
  if (!ensureApiKey()) return;
  const grp = document.getElementById('aiDictGroupSelect').value;
  const topic = document.getElementById('aiDictTopicInput').value.trim();
  if (!topic) return showToast('请输入想学习的专题名称');
  const btn = document.getElementById('aiDictGenBtn'); btn.disabled = true; btn.textContent = '参悟正在编撰专题...';
  try {
    const content = await callLLM([{ role:'user', content:`请为私人术数宝典编写一篇高密度实战专题词条：「${topic}」。要求：用 1. 2. 3. 编号分条写出核心取用、吉凶铁律、细节象意与应期规律，重点词用【】标注，严禁使用星号符号。` }]);
    const item = { id: uid('dct'), group: grp, name: topic, content: content.replace(/\*/g, '').trim(), createdAt: Date.now() };
    state.customDict.push(item);
    await dbPut('meta', { id: 'customDict', data: state.customDict });
    await markDirty();
    document.getElementById('aiDictTopicInput').value = '';
    closeSheet('sheet-ai-dict');
    state.dictGroup = grp; state.dictItemIdx = 0;
    renderMethodsView();
    showToast(`已将「${topic}」永久写入断法宝典`);
  } catch (e) { showToast('生成失败：' + e.message); }
  finally { btn.disabled = false; btn.textContent = 'AI 生成硬核干货并永久存入'; }
}

function ensureApiKey() { if (!state.settings.apiKey) { showToast('请先在左侧菜单 -> 主题·密钥中填写 API Key'); openSettings(); return false; } return true; }

  let out = String(text || '').replace(/1[3-9]\d{9}/g, '[已脱敏]');

}
async function callLLM(messages, { stream = false, tier = null, onChunk = null } = {}) {
  const s = state.settings, model = (tier || s.useTier) === 'pro' ? (s.proModel || 'deepseek-reasoner') : (s.flashModel || 'deepseek-chat'), base = (s.baseUrl || 'https://api.deepseek.com').replace(/\/$/, '');
  const resp = await fetch(`${base}/chat/completions`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${s.apiKey}` }, body: JSON.stringify({ model, messages: messages.map(m => ({ role: m.role, content: redactPrivateText(m.content) })), stream, temperature: 0.42 }) });
  if (!resp.ok) throw new Error(`接口失败(${resp.status})`);
  if (!stream) { const d = await resp.json(); if (d.usage) { s.tokensIn += d.usage.prompt_tokens || 0; s.tokensOut += d.usage.completion_tokens || 0; saveSettingsMeta(); } return d.choices?.[0]?.message?.content || ''; }
  const reader = resp.body.getReader(), dec = new TextDecoder(); let full = '', buf = '';
  while (true) { const { done, value } = await reader.read(); if (done) break; buf += dec.decode(value, { stream: true }); const lines = buf.split('\n'); buf = lines.pop() || ''; for (const ln of lines) { const t = ln.trim(); if (!t.startsWith('data:')) continue; const p = t.slice(5).trim(); if (p === '[DONE]') continue; try { const delta = JSON.parse(p).choices?.[0]?.delta?.content || ''; if (delta) { full += delta; if (onChunk) onChunk(full); } } catch (e) {} } }
  s.tokensIn += Math.round(JSON.stringify(messages).length * 0.6); s.tokensOut += Math.round(full.length * 0.8); saveSettingsMeta(); return full;
}

  html = html.replace(/《([^》]+)》第(\d+)页/g, `<span class="ref-jump" onclick="jumpToBookPage('$1',$2)">《$1》第$2页</span>`);

  try {
    await callLLM([{ role:'system', content:sys }, ...th.messages.slice(-7,-1).map(m=>({role:m.role==='ai'?'assistant':'user',content:m.content}))], {
      stream: true, onChunk: full => { aiMsg.content = full; const bs = document.querySelectorAll('#chatMessages .msg-row.ai .msg-bubble'); if (bs.length) bs[bs.length - 1].innerHTML = formatRichText(full); scrollChatToBottom(false); }
    });
  } catch (e) { aiMsg.content = '请求中断：' + e.message; }
  finally { aiMsg.streaming = false; state.isStreaming = false; th.updatedAt = Date.now(); await dbPut('chats', th); await markDirty(); renderCanwuView(); scrollChatToBottom(false); }
}
async function starCurrentThread() { const th = getActiveThread(); if (!th) return; th.starred = !th.starred; await dbPut('chats', th); renderCanwuView(); }
async function chatFeedback() { const fix = prompt('指出偏差或正确规律：'); if (!fix?.trim()) return; await saveMemoryItem(state.canwuRoom, 'fix', '实战纠偏：' + fix.trim()); showToast('已写入纠偏大脑'); }
function chatSaveNote(idx) { const th = getActiveThread(), m = th?.messages[idx]; if (m) createAndOpenNote({ title: th.title || '参悟摘录', body: m.content }); }
function openThreadDrawer() { document.getElementById('threadRoomName').textContent = state.canwuRoom; const list = state.chats.filter(t => t.room === state.canwuRoom).sort((a,b) => (b.starred?1:0)-(a.starred?1:0) || (b.updatedAt||b.createdAt)-(a.updatedAt||a.createdAt)); document.getElementById('threadListBody').innerHTML = !list.length ? '<div class="empty-box" style="padding:20px;"><p>暂无历史话题</p></div>' : list.map(t => `<div style="display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border);gap:8px;"><div style="flex:1;min-width:0;cursor:pointer;" onclick="state.activeThreadId='${t.id}';closeSheet('sheet-threads');renderCanwuView()"><div style="font-size:15px;font-weight:600;color:${t.id===state.activeThreadId?'var(--accent-deep)':'var(--text)'};">${t.starred?'★ ':''}${escapeHtml(t.title)}</div><div style="font-size:12px;color:var(--text-3);">${formatDateKey(new Date(t.updatedAt||t.createdAt))} · ${t.messages.length}条</div></div><button class="pill-mini" onclick="deleteThread('${t.id}')">删</button></div>`).join(''); openSheet('sheet-threads'); }
async function deleteThread(id) { await dbDel('chats', id); state.chats = state.chats.filter(t => t.id !== id); if (state.activeThreadId === id) state.activeThreadId = null; openThreadDrawer(); renderCanwuView(); }
function askCanwuFromReader() { const b = state.books.find(x => x.id === state.reader.bookId), ch = state.chapters.find(c => c.bookId === state.reader.bookId && (c.pageNum === state.reader.pageNum || c.idx === state.reader.pageNum - 1)); closeReader(); switchMainTab('canwu'); switchCanwuRoom(b?.category || state.category); document.getElementById('chatInput').value = `精讲《${b?.title||''}》第${state.reader.pageNum}页核心断法：\n${(ch?.content||'').slice(0, 600)}`; }

async function saveMemoryItem(cat, tier, text) { const it = { id: uid('mem'), category: cat, tier, text, createdAt: Date.now() }; await dbPut('memories', it); state.memories.push(it); await markDirty(); }
function openBrainModal() { document.getElementById('brainCatTag').textContent = state.canwuRoom; renderBrainList(state.canwuRoom); openSheet('sheet-brain'); }
function renderBrainList(cat) { const c = cat || state.canwuRoom, list = state.memories.filter(m => m.category === c).sort((a,b) => b.createdAt - a.createdAt); document.getElementById('brainMemList').innerHTML = !list.length ? `<div class="empty-box" style="padding:18px;"><p>「${c}」暂无沉淀铁律</p></div>` : list.map(m => `<div style="display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px;"><div><span class="pill-mini ${m.tier==='fix'?'accent':''}" style="padding:2px 7px;font-size:11px;margin-right:5px;">${m.tier==='fix'?'纠偏':'心法'}</span>${escapeHtml(m.text)}</div><button style="color:var(--text-3);" onclick="deleteMemory('${m.id}')">删</button></div>`).join(''); }
async function addManualMemory() { const inp = document.getElementById('newMemInput'), txt = inp.value.trim(); if (!txt) return; const c = document.getElementById('brainCatTag').textContent; await saveMemoryItem(c, 'core', txt); inp.value = ''; renderBrainList(c); showToast('已存入大脑'); }
async function deleteMemory(id) { await dbDel('memories', id); state.memories = state.memories.filter(m => m.id !== id); await markDirty(); renderBrainList(); }
async function runCrossBookSynthesis() { if (!ensureApiKey()) return; const c = document.getElementById('brainCatTag').textContent, bs = state.books.filter(b => b.category === c); if (bs.length < 2) return showToast(`请在「${c}」至少上传 2 本典籍`); showToast('跨书自悟中...'); try { const res = await callLLM([{ role:'user', content:`对比以下「${c}」典籍，提炼 3 条跨书融合心法（每条一行，严禁星号）：\n${bs.map(b=>`《${b.title}》`).join('\n')}` }], { tier:'flash' }); for (const ln of res.split('\n').map(s=>s.replace(/^[\d.\-、\s]+/,'').trim()).filter(s=>s.length>6).slice(0,3)) await saveMemoryItem(c, 'core', '跨书自悟：' + ln); renderBrainList(c); showToast('完成'); } catch (e) { showToast('失败：' + e.message); } }
async function runMemoryDistill() { if (!ensureApiKey()) return; const c = document.getElementById('brainCatTag').textContent, list = state.memories.filter(m => m.category === c); if (list.length < 4) return showToast('记忆条数不多'); try { const res = await callLLM([{ role:'user', content:`合并以下「${c}」记忆为 5 条精纯铁律（每条一行，严禁星号）：\n${list.map((m,i)=>`${i+1}. ${m.text}`).join('\n')}` }], { tier:'flash' }); const lines = res.split('\n').map(s=>s.replace(/^[\d.\-、\s]+/,'').trim()).filter(s=>s.length>5); if (lines.length) { for (const old of list) await dbDel('memories', old.id); state.memories = state.memories.filter(m => m.category !== c); for (const ln of lines) await saveMemoryItem(c, 'core', ln); renderBrainList(c); showToast('蒸馏完成'); } } catch (e) { showToast('失败：' + e.message); } }
async function generateHexDeepAI(key) { if (!ensureApiKey()) return; const h = HEX_DATA.byKey[key]; showToast('深度解析中...'); try { const text = await callLLM([{ role:'user', content:`用 1. 2. 3. 4. 编号（重点用【】标注，严禁星号）精解「${h.name}」（${h.palaceName}）：1. 核心气机 2. 六爻演进 3. 事业求财感情启示 4. 易错点` }], { tier:'flash' }); await dbPut('hexCache', { id: key, text, updatedAt: Date.now() }); renderHexDetail(); showToast('已缓存'); } catch (e) { showToast('失败：' + e.message); } }
function startVoiceInput(id) { const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SR) return showToast('请直接点手机键盘麦克风听写'); const rec = new SR(); rec.lang = 'zh-CN'; showToast('请说话...'); rec.onresult = e => { const el = document.getElementById(id); if (el) { el.value += (el.value ? ' ' : '') + e.results[0][0].transcript; el.dispatchEvent(new Event('input')); } }; rec.start(); }
function getCultivationRank() { const s = state.books.length * 10 + state.archives.length * 6 + state.memories.length * 8 + state.notes.length * 3; return s >= 180 ? '藏往境' : (s >= 100 ? '明理境' : (s >= 50 ? '问机境' : (s >= 20 ? '观象境' : '初窥境'))); }

// ==================== 12. 导航与初始化 ====================
function switchMainTab(tab) { state.mainTab = tab; document.querySelectorAll('.view-page').forEach(p => p.classList.toggle('active', p.id === 'view-' + tab)); document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.tab === tab)); renderAllCurrentViews(); }
function renderCatStrip() { document.getElementById('catStrip').innerHTML = CATEGORIES.map(c => `<button class="cat-pill ${c===state.category?'active':''}" onclick="switchCategory('${c}')">${c}</button>`).join(''); document.getElementById('notesTabLabel').textContent = state.category + '笔记'; }
function switchCategory(c) { state.category = c; renderCatStrip(); renderDivineView(); }
function switchSubTab(sub) { state.subTab = sub; document.getElementById('subTabSlider').style.transform = `translateX(${['cast','shelf','notes'].indexOf(sub) * 100}%)`; document.querySelectorAll('#view-divine .seg-btn').forEach(b => b.classList.toggle('active', b.dataset.sub === sub)); renderDivineView(); }
function renderDivineView() { const wrap = document.getElementById('divineScrollArea'); if (state.subTab === 'cast') renderCastPanel(wrap); else if (state.subTab === 'shelf') renderShelfPanel(wrap); else renderNotesPanel(wrap); }
function renderAllCurrentViews() { if (state.mainTab === 'divine') renderDivineView(); if (state.mainTab === 'calendar') renderCalendarView(); if (state.mainTab === 'methods') renderMethodsView(); if (state.mainTab === 'canwu') renderCanwuView(); }

async function loadAllFromDB() {
  const meta = await dbGet('meta', 'settings');
  if (meta?.data) {
    Object.assign(state.settings, meta.data);
    if (!state.settings.v8Migrated) { state.settings.theme = 'avocado'; state.settings.v8Migrated = true; await saveSettingsMeta(); }
  }
  const cd = await dbGet('meta', 'customDict'); if (Array.isArray(cd?.data)) state.customDict = cd.data;
  state.books = await dbGetAll('books'); state.chapters = await dbGetAll('chapters'); state.notes = await dbGetAll('notes');
  state.archives = await dbGetAll('archives'); state.chats = await dbGetAll('chats'); state.memories = await dbGetAll('memories');
  state.footprints = Object.fromEntries((await dbGetAll('footprints')).map(f => [f.id, f.count]));
}

async function initApp() {
  initShibaIcons();
  await openDB();
  await loadAllFromDB();
  applyVisualTheme();
  if (state.settings.dirtySinceBackup) document.getElementById('backupDot')?.classList.add('show');
  const chatBox = document.getElementById('chatMessages');
  chatBox.addEventListener('scroll', () => { const d = chatBox.scrollHeight - chatBox.scrollTop - chatBox.clientHeight; if (d > 64) { state.userScrolledUp = true; document.getElementById('scrollLatestBtn').classList.add('show'); } else { state.userScrolledUp = false; document.getElementById('scrollLatestBtn').classList.remove('show'); } });
  document.getElementById('chatInput').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendCanwuMessage(); } });
  renderCatStrip(); renderDivineView(); renderCanwuRoomStrip(); startLiveClockSync(); bindPhoneShakeForCast();
}
window.addEventListener('DOMContentLoaded', initApp);
</script>
