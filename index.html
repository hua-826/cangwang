<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="藏往 2.0"/>
  <link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoi藏往Mi4wIiwic2hvcnRfbmFtZSI6IuW8oOW8oSIsInN0YXJ0X3VybCI6Ii4iLCJkaXNwbGF5Ijoic3RhbmRhbG9uZSIsImJhY2tncm91bmRfY29sb3IiOiIjRkJGOUY1IiwidGhlbWVfY29sb3IiOiIjOWIzNjJlIn0=">
  <title>藏往 2.0｜术数典籍书斋</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root{
      --paper:#FBF9F5;
      --paper-deep:#EAE3D6;
      --paper-card:#FFFDFA;
      --ink:#221E1A;
      --ink-sub:#665C50;
      --ink-faint:#A89C8C;
      --line:#DDD2BF;
      --seal:#9B362E;
      --seal-active:#7D2A23;
      --accent-blue:#365B9B;

      --bg-dark:#1A1815;
      --card-dark:#272420;
      --ink-dark:#E8E2D7;
      --ink-sub-dark:#A99F8F;
      --line-dark:#3A352E;
    }
    [data-theme="dark"]{
      --paper:var(--bg-dark);
      --paper-deep:var(--card-dark);
      --paper-card:var(--card-dark);
      --ink:var(--ink-dark);
      --ink-sub:var(--ink-sub-dark);
      --ink-faint:#776F63;
      --line:var(--line-dark);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
    html,body{height:100%;background:var(--paper);color:var(--ink);font-family:"PingFang SC","Noto Serif SC",serif;overscroll-behavior-y:none;}
    body{display:flex;flex-direction:column;height:100dvh;overflow:hidden;}

    /* 顶部门类导航 */
    .cat-nav{
      flex-shrink:0;display:flex;gap:4px;padding:calc(8px + env(safe-area-inset-top)) 12px 6px 12px;background:var(--paper);border-bottom:1px solid var(--line);overflow-x:auto;user-select:none;
    }
    .cat-tab{
      flex:0 0 auto;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--paper-card);font-size:13px;white-space:nowrap;cursor:pointer;transition:0.18s;
    }
    .cat-tab.active{background:var(--seal);color:#fff;border-color:var(--seal);}

    .topbar{
      flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--paper);user-select:none;
    }
    .book-meta{min-width:0;flex:1;display:flex;flex-direction:column;}
    .book-title{font-size:16px;font-weight:600;letter-spacing:0.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .book-sub{font-size:11px;color:var(--ink-sub);margin-top:2px;}
    .top-actions{display:flex;gap:6px;align-items:center;flex-shrink:0;}

    .btn{appearance:none;border:1px solid var(--line);background:var(--paper-card);color:var(--ink);font-size:13px;padding:7px 11px;border-radius:6px;cursor:pointer;transition:0.15s;}
    .btn:active{background:var(--paper-deep);}
    .btn-primary{background:var(--seal);border-color:var(--seal);color:#fff;font-weight:500;}
    .btn-primary:active{background:var(--seal-active);}
    .btn-icon{padding:7px 9px;}

    /* 藏书阁书架面板 */
    .shelf-panel{
      position:fixed;inset:0;z-index:40;background:rgba(0,0,0,0.4);display:none;align-items:flex-end;justify-content:center;
    }
    .shelf-panel.open{display:flex;}
    .shelf-wrap{
      width:100%;max-width:720px;max-height:80dvh;background:var(--paper);border-radius:14px 14px 0 0;display:flex;flex-direction:column;overflow:hidden;padding-bottom:env(safe-area-inset-bottom);
    }
    .shelf-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);}
    .shelf-title{font-size:15px;font-weight:600;}
    .shelf-body{flex:1;overflow-y:auto;padding:14px;}
    .book-item{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:var(--paper-card);}
    .book-item.active{border-color:var(--seal);background:rgba(155,54,46,0.06);}
    .book-info{flex:1;min-width:0;}
    .book-name{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .book-meta-small{font-size:11px;color:var(--ink-sub);margin-top:2px;}
    .book-actions{display:flex;gap:4px;flex-shrink:0;}

    .progress-bar{display:none;padding:8px 14px;background:var(--paper-deep);border-bottom:1px solid var(--line);font-size:12px;color:var(--ink-sub);flex-shrink:0;}
    .progress-bar.show{display:block;}
    .progress-track{height:3px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden;}
    .progress-fill{height:100%;width:0;background:var(--seal);transition:0.15s linear;}

    .reader-main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 16px 90px 16px;}
    .empty-state{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--ink-sub);padding:20px;user-select:none;}
    .empty-seal{width:46px;height:46px;border:1.5px solid var(--seal);border-radius:6px;color:var(--seal);display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:16px;}
    .empty-text{font-size:15px;line-height:1.8;}

    .book-content{max-width:700px;margin:0 auto;font-size:18px;line-height:2;letter-spacing:0.04em;user-select:text;word-break:break-word;}
    .page-block{margin-bottom:26px;}
    .page-divider{display:flex;align-items:center;gap:8px;margin:20px 0 12px 0;font-size:11px;color:var(--ink-faint);user-select:none;}
    .page-divider::before,.page-divider::after{content:"";flex:1;height:1px;background:var(--line);}
    .page-block p{margin:0 0 12px 0;text-indent:2em;}

    .pager{max-width:700px;margin:24px auto 8px auto;display:flex;gap:8px;align-items:center;padding-top:14px;border-top:1px solid var(--line);user-select:none;}
    .pager select{flex:1;max-width:170px;background:var(--paper-card);border:1px solid var(--line);border-radius:6px;padding:7px 8px;font-size:13px;color:var(--ink);}

    /* 划词悬浮按钮 */
    .sel-pill{position:fixed;right:14px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:35;display:none;align-items:center;gap:8px;background:var(--seal);color:#fff;border-radius:999px;padding:10px 14px;box-shadow:0 6px 18px rgba(0,0,0,0.22);cursor:pointer;}
    .sel-pill.show{display:inline-flex;}
    .sel-pill .badge{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-size:13px;}
    .sel-pill .snippet{max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;opacity:0.9;}

    .ask-bar{flex-shrink:0;display:flex;gap:8px;align-items:center;padding:10px 14px calc(10px + env(safe-area-inset-bottom)) 14px;background:var(--paper);border-top:1px solid var(--line);z-index:20;}
    .ask-input{flex:1;border:1px solid var(--line);background:var(--paper-card);color:var(--ink);border-radius:8px;padding:9px 12px;font-size:15px;outline:none;}
    .ask-input:focus{border-color:var(--seal);}

    /* AI结果弹窗 */
    .sheet-mask{position:fixed;inset:0;background:rgba(0,0,0,0.42);z-index:50;display:none;align-items:flex-end;justify-content:center;}
    .sheet-mask.open{display:flex;}
    .sheet{width:100%;max-width:720px;max-height:78dvh;background:var(--paper);border-radius:14px 14px 0 0;display:flex;flex-direction:column;overflow:hidden;padding-bottom:env(safe-area-inset-bottom);}
    .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--paper-deep);flex-shrink:0;}
    .sheet-title{font-size:15px;font-weight:600;}
    .sheet-body{flex:1;overflow-y:auto;padding:16px;font-size:15px;line-height:1.85;}
    .quote-box{background:var(--paper-deep);border-left:3px solid var(--seal);padding:10px 12px;margin-bottom:14px;border-radius:0 6px 6px 0;font-size:14px;color:var(--ink-sub);}
    .ai-out{white-space:pre-wrap;word-break:break-word;}

    /* 设置面板 */
    .settings-view{position:fixed;inset:0;background:var(--paper);z-index:60;display:none;flex-direction:column;}
    .settings-view.open{display:flex;}
    .set-body{flex:1;overflow-y:auto;padding:18px 16px;max-width:560px;margin:0 auto;}
    .set-block{margin-bottom:22px;}
    .set-label{display:block;font-size:14px;font-weight:600;margin-bottom:8px;}
    .set-hint{font-size:12px;color:var(--ink-sub);margin-top:4px;line-height:1.6;}
    .key-row{display:flex;gap:8px;}
    .key-inp{flex:1;border:1px solid var(--line);background:var(--paper-card);border-radius:8px;padding:10px 12px;font-family:monospace;font-size:14px;outline:none;}
    .hr{border:none;border-top:1px solid var(--line);margin:22px 0;}
    .toast{position:fixed;left:50%;top:calc(60px + env(safe-area-inset-top));transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;z-index:90;display:none;white-space:nowrap;}
    .toast.show{display:block;}
    .hidden-file{display:none;}
  </style>
</head>
<body>
  <!-- 门类切换导航 -->
  <div class="cat-nav">
    <div class="cat-tab" data-cat="liuyao">六爻</div>
    <div class="cat-tab" data-cat="bazi">八字</div>
    <div class="cat-tab" data-cat="qimen">奇门</div>
    <div class="cat-tab" data-cat="fengshui">风水/户型</div>
  </div>

  <header class="topbar">
    <div class="book-meta">
      <div class="book-title" id="bookTitle">藏往 2.0</div>
      <div class="book-sub" id="bookSub">未选择典籍</div>
    </div>
    <div class="top-actions">
      <button class="btn" id="openShelfBtn">藏书阁</button>
      <button class="btn btn-icon" id="themeBtn">🌙</button>
      <button class="btn" id="openSetBtn">设置</button>
    </div>
  </header>

  <div class="progress-bar" id="progressBar">
    <div id="progText">解析中…</div>
    <div class="progress-track"><div class="progress-fill" id="progFill"></div></div>
  </div>

  <main class="reader-main" id="readerMain">
    <div class="empty-state" id="emptyState">
      <div class="empty-seal">藏</div>
      <div class="empty-text">打开藏书阁导入PDF典籍<br>多本典籍保存在本地IndexedDB</div>
    </div>
    <article class="book-content" id="bookContent" style="display:none;"></article>
    <div class="pager" id="pager" style="display:none;">
      <button class="btn" id="prevBtn">上一卷段</button>
      <select id="chunkSel"></select>
      <button class="btn" id="nextBtn">下一卷段</button>
    </div>
  </main>

  <button class="sel-pill" id="selPill">
    <span class="badge">解</span>
    <span>训诂推演</span>
    <span class="snippet" id="pillSnippet"></span>
  </button>

  <footer class="ask-bar">
    <input class="ask-input" id="askInput" placeholder="问书：针对当前选中典籍提问术数概念…" enterkeyhint="send">
    <button class="btn btn-primary" id="askBtn">问书</button>
  </footer>

  <!-- 藏书阁书架弹窗 -->
  <div class="shelf-panel" id="shelfPanel">
    <div class="shelf-wrap">
      <div class="shelf-head">
        <div class="shelf-title">我的藏书阁（本地书架）</div>
        <button class="btn" id="closeShelfBtn">关闭</button>
      </div>
      <div class="shelf-body" id="shelfBody">
        <button class="btn btn-primary" id="importPdfBtn" style="width:100%;margin-bottom:12px;">+ 导入新PDF典籍</button>
        <div id="bookListWrap"></div>
      </div>
    </div>
  </div>
  <input type="file" id="pdfInput" class="hidden-file" accept=".pdf,application/pdf">

  <!-- AI结果弹窗 -->
  <div class="sheet-mask" id="aiSheetMask">
    <div class="sheet">
      <div class="sheet-head">
        <div class="sheet-title" id="sheetTitle">解经推演</div>
        <button class="btn" id="closeSheetBtn">关闭</button>
      </div>
      <div class="sheet-body">
        <div class="quote-box" id="sheetQuote" style="display:none;"></div>
        <div class="ai-out" id="aiOutput"></div>
      </div>
    </div>
  </div>

  <!-- 设置面板 -->
  <section class="settings-view" id="settingsView">
    <header class="topbar">
      <div class="book-meta"><div class="book-title">设置</div></div>
      <div class="top-actions"><button class="btn" id="closeSetBtn">返回</button></div>
    </header>
    <div class="set-body">
      <div class="set-block">
        <label class="set-label">DeepSeek API‑Key</label>
        <div class="key-row">
          <input type="password" class="key-inp" id="apiKeyInp" placeholder="sk‑..." autocomplete="off">
          <button class="btn" id="toggleKeyBtn">显示</button>
          <button class="btn btn-primary" id="saveKeyBtn">保存</button>
        </div>
        <div class="set-hint">密钥仅保存在本机浏览器，直连deepseek‑chat接口</div>
      </div>
      <hr class="hr">
      <div class="set-block">
        <div class="set-hint">当前门类：<span id="catShow">六爻</span></div>
        <div class="set-hint">所有典籍存储在IndexedDB浏览器本地数据库</div>
      </div>
    </div>
  </section>

  <div class="toast" id="toast"></div>

<script>
(()=>{
  if(window.pdfjsLib){
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  }
  const DB_NAME = "CangWang2DB";
  const DB_VER = 1;
  const STORE_BOOKS = "books";
  const STORE_META = "meta";

  const API_KEY_STORE = "cangwang_apikey";
  const THEME_STORE = "cangwang_theme";
  const CAT_STORE = "cangwang_current_cat";
  const POS_PREFIX = "cangwang_pos_";

  const PAGES_PER_CHUNK = 12;
  const MAX_CONTEXT_CHARS = 28000;
  const DEEPSEEK_URL = "https://api.deepseek.com/chat/completions";

  let db = null;
  let bookList = [];
  let activeBookId = null;
  let currentChunk = 0;
  let selectedTextCache = "";
  let activeAbort = null;
  let selTimer = null;
  let scrollTimer = null;
  let currentCat = "liuyao";

  const el = {
    catNav:document.querySelectorAll(".cat-tab"),
    bookTitle:document.getElementById("bookTitle"),
    bookSub:document.getElementById("bookSub"),
    openShelfBtn:document.getElementById("openShelfBtn"),
    shelfPanel:document.getElementById("shelfPanel"),
    closeShelfBtn:document.getElementById("closeShelfBtn"),
    importPdfBtn:document.getElementById("importPdfBtn"),
    pdfInput:document.getElementById("pdfInput"),
    shelfBody:document.getElementById("shelfBody"),
    bookListWrap:document.getElementById("bookListWrap"),
    themeBtn:document.getElementById("themeBtn"),
    openSetBtn:document.getElementById("openSetBtn"),
    closeSetBtn:document.getElementById("closeSetBtn"),
    settingsView:document.getElementById("settingsView"),
    apiKeyInp:document.getElementById("apiKeyInp"),
    toggleKeyBtn:document.getElementById("toggleKeyBtn"),
    saveKeyBtn:document.getElementById("saveKeyBtn"),
    catShow:document.getElementById("catShow"),
    progressBar:document.getElementById("progressBar"),
    progText:document.getElementById("progText"),
    progFill:document.getElementById("progFill"),
    readerMain:document.getElementById("readerMain"),
    emptyState:document.getElementById("emptyState"),
    bookContent:document.getElementById("bookContent"),
    pager:document.getElementById("pager"),
    prevBtn:document.getElementById("prevBtn"),
    nextBtn:document.getElementById("nextBtn"),
    chunkSel:document.getElementById("chunkSel"),
    selPill:document.getElementById("selPill"),
    pillSnippet:document.getElementById("pillSnippet"),
    askInput:document.getElementById("askInput"),
    askBtn:document.getElementById("askBtn"),
    aiSheetMask:document.getElementById("aiSheetMask"),
    sheetTitle:document.getElementById("sheetTitle"),
    sheetQuote:document.getElementById("sheetQuote"),
    aiOutput:document.getElementById("aiOutput"),
    closeSheetBtn:document.getElementById("closeSheetBtn"),
    toast:document.getElementById("toast")
  };

  function showToast(msg){
    el.toast.textContent = msg;
    el.toast.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=>el.toast.classList.remove("show"),2200);
  }

  // IndexedDB
  async function openDB(){
    return new Promise((res,rej)=>{
      const req = indexedDB.open(DB_NAME,DB_VER);
      req.onupgradeneeded = e=>{
        const d = e.target.result;
        if(!d.objectStoreNames.contains(STORE_BOOKS)) d.createObjectStore(STORE_BOOKS,{keyPath:"id"});
        if(!d.objectStoreNames.contains(STORE_META)) d.createObjectStore(STORE_META);
      };
      req.onsuccess=()=>{db=req.result;res(db);};
      req.onerror=()=>rej(req.error);
    });
  }

  async function saveBook(bookObj){
    const tx = db.transaction(STORE_BOOKS,"readwrite");
    tx.objectStore(STORE_BOOKS).put(bookObj);
    await new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=rej;});
  }
  async function getAllBooks(){
    const tx = db.transaction(STORE_BOOKS,"readonly");
    return new Promise(res=>{
      const all = [];
      tx.objectStore(STORE_BOOKS).openCursor().onsuccess=e=>{
        const cur = e.target.result;
        if(cur){all.push(cur.value);cur.continue();}else res(all);
      };
    });
  }
  async function deleteBook(id){
    const tx = db.transaction(STORE_BOOKS,"readwrite");
    tx.objectStore(STORE_BOOKS).delete(id);
    await new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=rej;});
  }

  function saveReadingPos(bookId,chunk,scrollTop){
    try{localStorage.setItem(POS_PREFIX+bookId,JSON.stringify({chunk,scrollTop}));}catch(e){}
  }
  function loadReadingPos(bookId){
    try{
      const raw = localStorage.getItem(POS_PREFIX+bookId);
      return raw?JSON.parse(raw):{chunk:0,scrollTop:0};
    }catch(e){return {chunk:0,scrollTop:0};}
  }
  function getApiKey(){return (localStorage.getItem(API_KEY_STORE)||"").trim();}

  // 主题
  function applyTheme(mode){
    document.documentElement.setAttribute("data-theme",mode);
    el.themeBtn.textContent = mode==="dark"?"☀":"🌙";
    localStorage.setItem(THEME_STORE,mode);
  }
  function toggleTheme(){
    const cur = document.documentElement.getAttribute("data-theme");
    applyTheme(cur==="dark"?"light":"dark");
  }

  // 门类切换
  function setCat(cat){
    currentCat = cat;
    localStorage.setItem(CAT_STORE,cat);
    el.catNav.forEach(t=>t.classList.toggle("active",t.dataset.cat===cat));
    const map = {liuyao:"六爻",bazi:"八字",qimen:"奇门",fengshui:"风水/户型"};
    el.catShow.textContent = map[cat];
  }

  // 渲染书架列表弹窗
  async function renderShelf(){
    bookList = await getAllBooks();
    el.bookListWrap.innerHTML = "";
    if(bookList.length===0){
      el.bookListWrap.innerHTML = `<div style="text-align:center;color:var(--ink-sub);padding:16px">书架为空，请导入PDF典籍</div>`;
      return;
    }
    bookList.forEach(book=>{
      const div = document.createElement("div");
      div.className = "book-item"+(book.id===activeBookId?" active":"");
      div.innerHTML = `
        <div class="book-info">
          <div class="book-name">${escapeHtml(book.title)}</div>
          <div class="book-meta-small">${book.pages.length}页 · ${book.totalChars}字 · 门类:${catName(book.cat||"liuyao")}</div>
        </div>
        <div class="book-actions">
          <button class="btn select-book" data-id="${book.id}">打开</button>
          <button class="btn btn-danger del-book" data-id="${book.id}">删除</button>
        </div>
      `;
      el.bookListWrap.appendChild(div);
    });
    el.bookListWrap.querySelectorAll(".select-book").forEach(btn=>{
      btn.onclick = async ()=>{
        const bid = btn.dataset.id;
        const bk = bookList.find(x=>x.id===bid);
        if(!bk)return;
        activeBookId = bid;
        const pos = loadReadingPos(bid);
        renderReader(bk,pos.chunk,pos.scrollTop);
        el.shelfPanel.classList.remove("open");
      };
    });
    el.bookListWrap.querySelectorAll(".del-book").forEach(btn=>{
      btn.onclick = async ()=>{
        const bid = btn.dataset.id;
        if(!confirm("确定删除这本典籍？删除后本地不可恢复。"))return;
        await deleteBook(bid);
        localStorage.removeItem(POS_PREFIX+bid);
        if(activeBookId===bid){
          activeBookId=null;
          renderReader(null,0,0);
        }
        await renderShelf();
        showToast("已删除");
      };
    });
  }
  function catName(c){
    const m = {liuyao:"六爻",bazi:"八字",qimen:"奇门",fengshui:"风水"};
    return m[c]||"未归类";
  }
  function escapeHtml(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  // 阅读器渲染
  function renderReader(book,targetChunk,targetScrollTop){
    if(!book){
      el.bookTitle.textContent = "藏往 2.0";
      el.bookSub.textContent = "未选择典籍";
      el.emptyState.style.display="flex";
      el.bookContent.style.display="none";
      el.pager.style.display="none";
      el.bookContent.innerHTML="";
      return;
    }
    const totalPages = book.pages.length;
    const totalChunks = Math.max(1,Math.ceil(totalPages/PAGES_PER_CHUNK));
    currentChunk = Math.min(Math.max(0,targetChunk||0),totalChunks-1);
    const startIdx = Math.imul(currentChunk,PAGES_PER_CHUNK);
    const endIdx = Math.min(totalPages,startIdx+PAGES_PER_CHUNK);

    el.bookTitle.textContent = book.title;
    el.bookSub.textContent = `第${startIdx+1}-${endIdx}页 / 共${totalPages}页【${catName(book.cat)}】`;
    el.emptyState.style.display="none";
    el.bookContent.style.display="block";
    el.pager.style.display="flex";

    const frag = document.createDocumentFragment();
    for(let i=startIdx;i<endIdx;i++){
      const p = book.pages[i];
      const blk = document.createElement("div");
      blk.className="page-block";
      const divi = document.createElement("div");
      divi.className="page-divider";
      divi.textContent = `第${p.pageNum}页`;
      blk.appendChild(divi);
      const lines = p.text.split(/\n+/).map(s=>s.trim()).filter(Boolean);
      if(lines.length===0){
        const pp = document.createElement("p");
        pp.textContent="（本页无文本）";pp.style.color="var(--ink-faint)";
        blk.appendChild(pp);
      }else{
        for(const ln of lines){
          const pp = document.createElement("p");
          pp.textContent = ln;
          blk.appendChild(pp);
        }
      }
      frag.appendChild(blk);
    }
    el.bookContent.innerHTML="";
    el.bookContent.appendChild(frag);

    el.chunkSel.innerHTML="";
    for(let c=0;c<totalChunks;c++){
      const opt = document.createElement("option");
      const s = Math.imul(c,PAGES_PER_CHUNK)+1;
      const e = Math.min(totalPages,s+PAGES_PER_CHUNK-1);
      opt.value = String(c);
      opt.textContent = `第${s}-${e}页`;
      if(c===currentChunk) opt.selected=true;
      el.chunkSel.appendChild(opt);
    }
    el.prevBtn.disabled = currentChunk<=0;
    el.nextBtn.disabled = currentChunk>=totalChunks-1;
    requestAnimationFrame(()=>el.readerMain.scrollTop = targetScrollTop||0);
  }

  function cleanLine(str){
    let s = str.replace(/\s+/g," ").trim();
    s = s.replace(/([\u4e00-\u9fff])\s+([\u4e00-\u9fff])/g,"$1$2");
    return s;
  }

  async function parsePdf(file){
    if(!window.pdfjsLib){showToast("PDF解析库未加载，请联网");return;}
    el.progressBar.classList.add("show");
    el.progText.textContent="读取PDF…";el.progFill.style.width="4%";
    try{
      const buf = await file.arrayBuffer();
      const pdfDoc = await pdfjsLib.getDocument({
        data:new Uint8Array(buf),
        cMapUrl:"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/",
        cMapPacked:true
      }).promise;
      const numPages = pdfDoc.numPages;
      const pages = [];
      let totalChars = 0;
      for(let p=1;p<=numPages;p++){
        const pct = Math.max(5,Math.min(99,Math.floor((p/numPages)*100)));
        el.progText.textContent=`解析：第${p}/${numPages}页`;
        el.progFill.style.width = pct+"%";
        const pg = await pdfDoc.getPage(p);
        const ctt = await pg.getTextContent();
        let curLine = "";
        let lastY = null;
        let lines = [];
        for(const it of ctt.items){
          const st = it.str||"";
          if(!st) continue;
          const y = it.transform?it.transform[5]:0;
          const h = it.height||12;
          if(lastY!==null && Math.abs(y-lastY)>(h/1.4)){
            const cl = cleanLine(curLine);
            if(cl) lines.push(cl);
            curLine = st;
          }else{
            curLine+=st;
          }
          lastY = y;
          if(it.hasEOL){
            const cl = cleanLine(curLine);
            if(cl) lines.push(cl);
            curLine="";lastY=null;
          }
        }
        if(curLine.trim()){const cl=cleanLine(curLine);if(cl)lines.push(cl);}
        const merged = [];
        for(const ln of lines){
          if(merged.length>0 && merged[merged.length-1].length>18
            && !/[。！？；：”」』】]$/.test(merged[merged.length-1])
            && !/^(第[一二三四五六七八九十百千万0-9]+[卷篇章回节]|卷[一二三四五六七八九十0-9]+)/.test(ln)){
            merged[merged.length-1]+=ln;
          }else merged.push(ln);
        }
        const pt = merged.join("\n");
        totalChars += pt.length;
        pages.push({pageNum:p,text:pt});
      }
      if(totalChars<20){showToast("未提取文字，PDF为图片扫描版");return;}
      const bookId = "bk_"+Date.now()+"_"+Math.random().toString(36).slice(2);
      const bookObj = {
        id:bookId,
        title:file.name.replace(/\.pdf$/i,""),
        cat:currentCat,
        pages,totalChars,createdAt:Date.now()
      };
      el.progText.textContent="写入本地数据库";el.progFill.style.width="100%";
      await saveBook(bookObj);
      activeBookId = bookId;
      saveReadingPos(bookId,0,0);
      renderReader(bookObj,0,0);
      showToast(`《${bookObj.title}》导入成功`);
    }catch(err){
      console.error(err);showToast("解析失败："+(err.message||"异常"));
    }finally{
      setTimeout(()=>{el.progressBar.classList.remove("show");el.progFill.style.width="0%";},350);
      el.pdfInput.value="";
      await renderShelf();
    }
  }

  // 本地检索：关键词召回，大字符上限，兜底读取附近页
  function retrieveContext(query,book){
    if(!book||!book.pages) return "";
    if(book.totalChars <= MAX_CONTEXT_CHARS){
      return book.pages.filter(p=>p.text.trim()).map(p=>`【第${p.pageNum}页】\n${p.text}`).join("\n\n");
    }
    const stopWords = new Set(["什么","怎么","如何","请问","一下","哪些","是否","意思","解释","书中","本书","里面","这个","那个","为什么","可以","应该","关于","问题","告诉"]);
    const cleanQ = query.replace(/[^\u4e00-\u9fffa-zA-Z0-9]/g," ").trim();
    const terms = new Set();
    const parts = cleanQ.split(/\s+/).filter(Boolean);
    for(const part of parts){
      if(part.length>=2 && !stopWords.has(part)) terms.add(part);
      if(/^[\u4e00-\u9fff]+$/.test(part)){
        for(let len=2;len<=4;len++){
          for(let i=0;i<=part.length-len;i++){
            const sub = part.slice(i,i+len);
            if(!stopWords.has(sub)) terms.add(sub);
          }
        }
      }
    }
    const termList = Array.from(terms);
    const scored = book.pages.map((p,idx)=>{
      let score=0,matchDist=0;
      const txt = p.text;
      if(!txt) return {idx,page:p,score:0};
      for(const t of termList){
        const pos = txt.indexOf(t);
        if(pos!==-1){
          matchDist++;
          let cnt=0,pp=pos;
          while(pp!==-1 && cnt<6){cnt++;pp=txt.indexOf(t,pp+t.length);}
          const w = t.length>=3?4:2;
          score += cnt*w;
        }
      }
      score += matchDist*5;
      return {idx,page:p,score};
    });
    scored.sort((a,b)=>b.score-a.score);
    const picked = new Set();
    let charSum = 0;
    for(const it of scored){
      if(it.score<=0) break;
      if(charSum + it.page.text.length > MAX_CONTEXT_CHARS){
        if(picked.size>=3) break;
      }
      picked.add(it.idx);
      charSum += it.page.text.length;
    }
    if(picked.size===0){
      const st = Math.imul(currentChunk,PAGES_PER_CHUNK);
      for(let i=st;i<Math.min(book.pages.length,st+20);i++) picked.add(i);
    }
    const ord = Array.from(picked).sort((a,b)=>a-b);
    return ord.map(i=>`【第${book.pages[i].pageNum}页】\n${book.pages[i].text}`).join("\n\n");
  }

  async function streamAi(messages){
    const key = getApiKey();
    if(!key){el.aiOutput.textContent="请前往设置填写DeepSeek API‑Key";return;}
    if(activeAbort) activeAbort.abort();
    activeAbort = new AbortController();
    el.aiOutput.textContent = "深度推演中…";
    try{
      const res = await fetch(DEEPSEEK_URL,{
        method:"POST",
        headers:{"Content‑Type":"application/json","Authorization":"Bearer "+key},
        body:JSON.stringify({model:"deepseek‑chat",messages,temperature:0.3,stream:true}),
        signal:activeAbort.signal
      });
      if(!res.ok){
        const errText = await res.text().catch(()=>"");
        if(res.status===401) el.aiOutput.textContent="API‑Key无效或过期，请检查设置";
        else el.aiOutput.textContent=`请求错误${res.status}:${errText.slice(0,180)}`;
        return;
      }
      const reader = res.body.getReader();
      const dec = new TextDecoder("utf‑8");
      let buf="",full="";
      while(true){
        const {done,value}=await reader.read();
        if(done)break;
        buf += dec.decode(value,{stream:true});
        const lines = buf.split("\n");
        buf = lines.pop()||"";
        for(const raw of lines){
          const line = raw.trim();
          if(!line||!line.startsWith("data:")) continue;
          const pl = line.replace(/^data:\s*/,"");
          if(pl==="[DONE]") break;
          try{
            const j = JSON.parse(pl);
            const delta = j.choices?.[0]?.delta?.content;
            if(delta){full+=delta;el.aiOutput.textContent=full;}
          }catch(e){}
        }
      }
      if(!full) el.aiOutput.textContent="未返回内容，请重试";
    }catch(err){
      if(err.name==="AbortError") return;
      el.aiOutput.textContent="网络异常，请检查网络";
    }
  }

  function openSheet(title,quote){
    el.sheetTitle.textContent = title;
    if(quote){el.sheetQuote.textContent=quote;el.sheetQuote.style.display="block";}
    else el.sheetQuote.style.display="none";
    el.aiSheetMask.classList.add("open");
  }
  function closeSheet(){
    if(activeAbort){activeAbort.abort();activeAbort=null;}
    el.aiSheetMask.classList.remove("open");
  }

  // 划词选中文本
  function onSelChange(){
    clearTimeout(selTimer);
    selTimer = setTimeout(()=>{
      const sel = window.getSelection();
      if(!sel||sel.isCollapsed){el.selPill.classList.remove("show");return;}
      const txt = sel.toString().trim();
      if(!txt||txt.length<2){el.selPill.classList.remove("show");return;}
      if(!el.bookContent.contains(sel.anchorNode)){el.selPill.classList.remove("show");return;}
      selectedTextCache = txt.slice(0,900);
      el.pillSnippet.textContent = "「"+selectedTextCache.slice(0,10)+(selectedTextCache.length>10?"…":"")+"」";
      el.selPill.classList.add("show");
    },180);
  }

  // 划词解：训诂+铁律+例外反转
  async function handleSelExplain(){
    const text = selectedTextCache;
    if(!text) return;
    el.selPill.classList.remove("show");
    try{window.getSelection().removeAllRanges();}catch(e){}
    const bookHint = activeBookId?`《${(bookList.find(b=>b.id===activeBookId)||{}).title||""}》`:"";
    openSheet("划词训诂推演",text);
    await streamAi([
      {role:"system",content:`你是精通术数古籍的训诂学者。针对${bookHint}选中古文，严格输出三段纯文本，禁止markdown星号，禁止寒暄：
【白话训诂】
做精准通俗白话翻译，解释古词古义。

【铁律】
提炼本段的核心术数硬性规则、判断逻辑，逐条简明。

【例外反转】
写出此规则不生效的条件、反例、特殊情形。`},
      {role:"user",content:"解读古文：\n"+text}
    ]);
  }

  // 问书：强语义prompt，不轻易返回查不到，允许语义近似匹配
  async function submitAsk(){
    const q = el.askInput.value.trim();
    if(!q)return;
    const book = bookList.find(b=>b.id===activeBookId);
    if(!book){showToast("请先在藏书阁打开一本典籍");return;}
    el.askInput.blur();
    const ctx = retrieveContext(q,book);
    openSheet(`问书：${q}`,null);
    await streamAi([
      {role:"system",content:`你是严谨术数典籍研读助手，仅使用下方《${book.title}》提供的原文片段作答。
重要规则：用户提问用词经常与古籍原文不完全一模一样，**不要死抠字面字符，要做语义、概念、术数含义联想匹配**。
如果原文没有完全一模一样的句子，但存在概念相近、原理相关条文，必须摘录近似相关条文，不允许直接说查不到。
只有全部提供的原文片段完全不存在相关概念，才写：当前检索片段未见直接相关记载。

输出固定格式纯文本，不要星号markdown：
【出处条文】
摘录匹配或概念近似的原句，标明页码；无相关才写未见记载。

【解析解答】
基于摘录原文深度推演解读；若只有近似条文，必须写明：原文没有与提问完全一致原话，以下条文概念原理相近。
可以综合多条相关原文做逻辑推导，不要引用本书以外外部知识。`},
      {role:"user",content:`以下是《${book.title}》原文片段：
${ctx}

我的问题：${q}`}
    ]);
  }

  // 事件绑定
  el.catNav.forEach(tab=>{
    tab.onclick = ()=>{setCat(tab.dataset.cat);};
  });
  el.themeBtn.onclick = toggleTheme;

  el.openShelfBtn.onclick = async ()=>{await renderShelf();el.shelfPanel.classList.add("open");};
  el.closeShelfBtn.onclick = ()=>el.shelfPanel.classList.remove("open");
  el.importPdfBtn.onclick = ()=>el.pdfInput.click();
  el.pdfInput.onchange = e=>{
    const f = e.target.files&&e.target.files[0];
    if(f) parsePdf(f);
  };

  el.prevBtn.onclick = async ()=>{
    const bk = bookList.find(x=>x.id===activeBookId);
    if(!bk||currentChunk<=0) return;
    renderReader(bk,currentChunk-1,0);
    saveReadingPos(activeBookId,currentChunk-1,0);
  };
  el.nextBtn.onclick = async ()=>{
    const bk = bookList.find(x=>x.id===activeBookId);
    if(!bk) return;
    const totalChunks = Math.ceil(bk.pages.length/PAGES_PER_CHUNK);
    if(currentChunk>=totalChunks-1) return;
    renderReader(bk,currentChunk+1,0);
    saveReadingPos(activeBookId,currentChunk+1,0);
  };
  el.chunkSel.onchange = async e=>{
    const idx = parseInt(e.target.value,10)||0;
    const bk = bookList.find(x=>x.id===activeBookId);
    if(!bk)return;
    renderReader(bk,idx,0);
    saveReadingPos(activeBookId,idx,0);
  };
  el.readerMain.addEventListener("scroll",()=>{
    if(!activeBookId)return;
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(()=>{
      saveReadingPos(activeBookId,currentChunk,el.readerMain.scrollTop);
    },250);
  },{passive:true});
  document.addEventListener("selectionchange",onSelChange);
  el.selPill.onclick = handleSelExplain;

  el.askBtn.onclick = submitAsk;
  el.askInput.addEventListener("keydown",e=>{
    if(e.key==="Enter"){e.preventDefault();submitAsk();}
  });
  el.closeSheetBtn.onclick = closeSheet;
  el.aiSheetMask.onclick = e=>{if(e.target===el.aiSheetMask) closeSheet();};

  el.openSetBtn.onclick = ()=>{
    el.apiKeyInp.value = getApiKey();
    el.settingsView.classList.add("open");
  };
  el.closeSetBtn.onclick = ()=>el.settingsView.classList.remove("open");
  el.toggleKeyBtn.onclick = ()=>{
    const isPwd = el.apiKeyInp.type==="password";
    el.apiKeyInp.type = isPwd?"text":"password";
    el.toggleKeyBtn.textContent = isPwd?"隐藏":"显示";
  };
  el.saveKeyBtn.onclick = ()=>{
    const val = el.apiKeyInp.value.trim();
    localStorage.setItem(API_KEY_STORE,val);
    showToast(val?"API‑Key已保存本机":"API‑Key已清空");
  };

  // 初始化
  (async function init(){
    await openDB();
    bookList = await getAllBooks();
    const savedCat = localStorage.getItem(CAT_STORE);
    if(savedCat) setCat(savedCat);
    const savedTheme = localStorage.getItem(THEME_STORE);
    applyTheme(savedTheme||"light");
  })();

})();
</script>
