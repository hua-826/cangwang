<!DOCTYPE html>
<html lang="zh-CN" data-skin="porcelain" data-paper="pure-white" data-font="mixed">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="藏往">
  <meta name="theme-color" id="themeColorMeta" content="#F9F9FB">
  <title>藏往 · 随身典籍书房</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect width='128' height='128' rx='28' fill='%2318181B'/%3E%3Ctext x='64' y='85' font-size='62' text-anchor='middle' fill='%23FAFAFA' font-family='serif' font-weight='600'%3E%E8%97%8F%3C/text%3E%3C/svg%3E">
  <link rel="apple-touch-icon" id="appleTouchIcon">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root,
    html[data-skin="porcelain"] {
      --bg-app: #F7F7F9;
      --bg-surface: #FFFFFF;
      --bg-subtle: #EFEFF3;
      --bg-glass: rgba(255, 255, 255, 0.88);
      --ink: #18181B;
      --ink-sub: #63636B;
      --ink-faint: #9E9EA8;
      --border: #E6E6EC;
      --border-strong: #D4D4DD;
      --accent: #18181B;
      --accent-ink: #FFFFFF;
      --accent-soft: rgba(24, 24, 27, 0.07);
      --brand-tint: #3F5A5C;
      --brand-soft: rgba(63, 90, 92, 0.11);
      --danger: #B9382C;
      --danger-soft: rgba(185, 56, 44, 0.09);
      --shadow-sm: 0 2px 10px rgba(24, 24, 27, 0.05);
      --shadow-md: 0 10px 30px rgba(24, 24, 27, 0.09);
      --mask: rgba(15, 15, 20, 0.42);
      --font-serif: "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      --font-kai: "Kaiti SC", "STKaiti", "KaiTi", "Songti SC", serif;
      --reader-size: 18px;
    }

    html[data-skin="celadon"] {
      --bg-app: #F1F5F4;
      --bg-surface: #FAFCFB;
      --bg-subtle: #E4ECEA;
      --bg-glass: rgba(250, 252, 251, 0.90);
      --ink: #1D2B2A;
      --ink-sub: #546866;
      --ink-faint: #879B98;
      --border: #D8E4E1;
      --border-strong: #C2D3CF;
      --accent: #2C5450;
      --accent-ink: #FFFFFF;
      --accent-soft: rgba(44, 84, 80, 0.10);
      --brand-tint: #2C5450;
      --brand-soft: rgba(44, 84, 80, 0.11);
      --shadow-sm: 0 2px 10px rgba(29, 43, 42, 0.06);
      --shadow-md: 0 10px 30px rgba(29, 43, 42, 0.10);
      --mask: rgba(18, 28, 27, 0.42);
    }

    html[data-skin="jade"] {
      --bg-app: #F6F3EC;
      --bg-surface: #FFFDF9;
      --bg-subtle: #EBE5D9;
      --bg-glass: rgba(255, 253, 249, 0.90);
      --ink: #29241F;
      --ink-sub: #6B6155;
      --ink-faint: #9D9183;
      --border: #E4DCCD;
      --border-strong: #D1C6B3;
      --accent: #6E523B;
      --accent-ink: #FFFDF9;
      --accent-soft: rgba(110, 82, 59, 0.10);
      --brand-tint: #6E523B;
      --brand-soft: rgba(110, 82, 59, 0.11);
      --shadow-sm: 0 2px 10px rgba(41, 36, 31, 0.06);
      --shadow-md: 0 10px 30px rgba(41, 36, 31, 0.10);
      --mask: rgba(26, 22, 18, 0.44);
    }

    html[data-skin="obsidian"] {
      --bg-app: #111113;
      --bg-surface: #1B1B1F;
      --bg-subtle: #25252B;
      --bg-glass: rgba(27, 27, 31, 0.90);
      --ink: #EAEAEF;
      --ink-sub: #A0A0AC;
      --ink-faint: #6B6B76;
      --border: #2C2C33;
      --border-strong: #3C3C46;
      --accent: #EAEAEF;
      --accent-ink: #111113;
      --accent-soft: rgba(234, 234, 239, 0.12);
      --brand-tint: #8FB2B5;
      --brand-soft: rgba(143, 178, 181, 0.16);
      --danger: #E06C60;
      --danger-soft: rgba(224, 108, 96, 0.15);
      --shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.35);
      --shadow-md: 0 12px 32px rgba(0, 0, 0, 0.55);
      --mask: rgba(0, 0, 0, 0.68);
    }

    html[data-paper="pure-white"] {
      --paper-bg: #FFFFFF;
      --paper-ink: #1C1C1F;
      --paper-sub: #5E5E66;
      --paper-border: #ECECF0;
    }

    html[data-paper="mist-gray"] {
      --paper-bg: #F2F2F5;
      --paper-ink: #1E1E22;
      --paper-sub: #5D5D66;
      --paper-border: #E0E0E6;
    }

    html[data-paper="soft-beige"] {
      --paper-bg: #F6F2E8;
      --paper-ink: #2B2620;
      --paper-sub: #6B6256;
      --paper-border: #E5DEC9;
    }

    html[data-paper="tea-green"] {
      --paper-bg: #E9F1E8;
      --paper-ink: #1E2C22;
      --paper-sub: #526858;
      --paper-border: #D3E1D2;
    }

    html[data-paper="charcoal"] {
      --paper-bg: #161618;
      --paper-ink: #DFDFE4;
      --paper-sub: #9595A0;
      --paper-border: #2B2B31;
    }

    html[data-font="mixed"] {
      --read-modern: var(--font-sans);
      --read-orig: var(--font-serif);
    }

    html[data-font="serif"] {
      --read-modern: var(--font-serif);
      --read-orig: var(--font-serif);
    }

    html[data-font="sans"] {
      --read-modern: var(--font-sans);
      --read-orig: var(--font-sans);
    }

    html[data-font="kai"] {
      --read-modern: var(--font-kai);
      --read-orig: var(--font-kai);
    }

    html {
      box-sizing: border-box;
      height: 100%;
      background: var(--bg-app);
      color: var(--ink);
      font-family: var(--font-sans);
      overscroll-behavior: none;
    }

    body, div, header, nav, main, footer, section, article, p, h1, h2, h3, h4, ul, li, input, textarea, button, span, label, select, table, thead, tbody, tr, th, td {
      box-sizing: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--bg-app);
      color: var(--ink);
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .view {
      flex: 1;
      display: none;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .view.active {
      display: flex;
    }

    .home-header {
      flex-shrink: 0;
      background: var(--bg-app);
      padding: calc(10px + env(safe-area-inset-top)) 16px 8px 16px;
      user-select: none;
      -webkit-user-select: none;
    }

    .home-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .brand-title {
      font-family: var(--font-serif);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--ink);
    }

    .icon-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--ink);
      width: 36px;
      height: 36px;
      border-radius: 11px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
    }

    .icon-btn:active {
      background: var(--bg-subtle);
    }

    .icon-btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
    }

    .cat-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      background: var(--bg-subtle);
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 10px;
    }

    .cat-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--ink-sub);
      font-size: 13.5px;
      font-weight: 500;
      padding: 8px 4px;
      border-radius: 9px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: background 0.15s, color 0.15s;
    }

    .cat-btn.active {
      background: var(--bg-surface);
      color: var(--ink);
      font-weight: 600;
      box-shadow: var(--shadow-sm);
    }

    .cat-badge {
      font-size: 10.5px;
      color: var(--ink-faint);
      font-weight: 500;
    }

    .cat-btn.active .cat-badge {
      color: var(--brand-tint);
    }

    .sub-tabs {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 2px 4px 0 4px;
      border-bottom: 1px solid var(--border);
    }

    .sub-tab {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--ink-faint);
      font-size: 14px;
      font-weight: 600;
      padding: 6px 2px 9px 2px;
      position: relative;
      cursor: pointer;
    }

    .sub-tab.active {
      color: var(--ink);
    }

    .sub-tab.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 2px;
      background: var(--accent);
      border-radius: 2px;
    }

    .home-scroll {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 14px 16px 24px 16px;
    }

    .recent-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
    }

    .recent-card:active {
      transform: scale(0.99);
    }

    .mini-cover {
      width: 58px;
      height: 80px;
      border-radius: 4px 8px 8px 4px;
      flex-shrink: 0;
      position: relative;
      padding: 8px 7px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.10), inset 4px 0 6px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    .mini-cover-title {
      font-family: var(--font-serif);
      font-size: 11px;
      font-weight: 700;
      line-height: 1.3;
      color: #262629;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .mini-cover-tag {
      font-size: 9px;
      color: rgba(38, 38, 41, 0.62);
    }

    .recent-info {
      min-width: 0;
      flex: 1;
    }

    .recent-kicker {
      font-size: 11px;
      color: var(--brand-tint);
      font-weight: 600;
      margin-bottom: 4px;
    }

    .recent-title {
      font-family: var(--font-serif);
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 5px;
    }

    .recent-meta {
      font-size: 12px;
      color: var(--ink-sub);
      margin-bottom: 8px;
    }

    .prog-track {
      height: 4px;
      background: var(--bg-subtle);
      border-radius: 99px;
      overflow: hidden;
    }

    .prog-fill {
      height: 100%;
      background: var(--brand-tint);
      border-radius: 99px;
    }

    .section-label {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink-sub);
      margin: 0 0 12px 2px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .shelf-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px 12px;
    }

    .book-tile {
      display: flex;
      flex-direction: column;
      cursor: pointer;
      position: relative;
    }

    .book-cover {
      width: 100%;
      aspect-ratio: 3 / 4.1;
      border-radius: 4px 10px 10px 4px;
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.09), inset 6px 0 8px rgba(0, 0, 0, 0.08);
      transition: transform 0.15s ease;
      overflow: hidden;
    }

    .book-tile:active .book-cover {
      transform: scale(0.96);
    }

    .book-cover-title {
      font-family: var(--font-serif);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.4;
      color: #242428;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }

    .book-cover-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      color: rgba(36, 36, 40, 0.62);
    }

    .book-del-dot {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: none;
      background: rgba(24, 24, 27, 0.55);
      color: #FFFFFF;
      font-size: 12px;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 4;
    }

    .shelf-editing .book-del-dot {
      display: inline-flex;
    }

    .book-tile-name {
      margin-top: 7px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .book-tile-sub {
      font-size: 11px;
      color: var(--ink-faint);
      margin-top: 2px;
    }

    .empty-box {
      padding: 54px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .empty-glyph {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      font-family: var(--font-serif);
      font-size: 26px;
      font-weight: 700;
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
    }

    .empty-title {
      font-family: var(--font-serif);
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .empty-desc {
      font-size: 13px;
      line-height: 1.75;
      color: var(--ink-sub);
      max-width: 280px;
      margin-bottom: 20px;
    }

    .kb-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 15px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
    }

    .kb-card:active {
      background: var(--bg-subtle);
    }

    .kb-card-title {
      font-family: var(--font-serif);
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 4px;
    }

    .kb-card-meta {
      font-size: 12px;
      color: var(--ink-sub);
    }

    .kb-back-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 10px;
    }

    .kb-chap-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
    }

    .kb-chap-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .kb-chap-title {
      font-family: var(--font-serif);
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
    }

    .kb-table-wrap {
      margin-top: 12px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .kb-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 520px;
      background: var(--bg-surface);
    }

    .kb-table th {
      background: var(--bg-subtle);
      color: var(--ink);
      font-weight: 600;
      text-align: left;
      padding: 9px 10px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    .kb-table td {
      padding: 9px 10px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
      line-height: 1.65;
      color: var(--ink);
    }

    .kb-table tr:last-child td {
      border-bottom: none;
    }

    .kb-orig-cell {
      font-family: var(--font-serif);
      color: var(--ink-sub);
    }

    .note-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 13px 14px;
      margin-bottom: 10px;
    }

    .note-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--brand-tint);
      font-weight: 600;
      margin-bottom: 6px;
    }

    .note-body {
      font-size: 13.5px;
      line-height: 1.75;
      color: var(--ink);
      white-space: pre-wrap;
    }

    .reader-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: calc(8px + env(safe-area-inset-top)) 12px 8px 12px;
      background: var(--paper-bg);
      border-bottom: 1px solid var(--paper-border);
      color: var(--paper-ink);
      user-select: none;
      -webkit-user-select: none;
    }

    .mode-switch {
      display: inline-flex;
      background: var(--bg-subtle);
      padding: 3px;
      border-radius: 999px;
      gap: 2px;
    }

    .mode-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--ink-sub);
      font-size: 12px;
      font-weight: 600;
      padding: 5px 11px;
      border-radius: 999px;
      cursor: pointer;
    }

    .mode-btn.active {
      background: var(--bg-surface);
      color: var(--ink);
      box-shadow: var(--shadow-sm);
    }

    .reader-chip-btn {
      appearance: none;
      border: 1px solid var(--paper-border);
      background: transparent;
      color: var(--paper-ink);
      font-size: 12.5px;
      padding: 6px 10px;
      border-radius: 9px;
      cursor: pointer;
    }

    .reader-chip-btn.active {
      background: var(--brand-soft);
      border-color: var(--brand-tint);
      color: var(--brand-tint);
      font-weight: 600;
    }

    .reader-stage {
      flex: 1;
      min-height: 0;
      background: var(--paper-bg);
      color: var(--paper-ink);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .reader-leaf {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      transform-origin: left center;
      will-change: transform, opacity;
    }

    .flip-next {
      animation: flipNext 0.30s cubic-bezier(0.22, 0.72, 0.3, 1);
    }

    .flip-prev {
      animation: flipPrev 0.30s cubic-bezier(0.22, 0.72, 0.3, 1);
    }

    @keyframes flipNext {
      0% { opacity: 0.3; transform: perspective(1200px) rotateY(-7deg) translateX(22px); }
      100% { opacity: 1; transform: perspective(1200px) rotateY(0deg) translateX(0); }
    }

    @keyframes flipPrev {
      0% { opacity: 0.3; transform: perspective(1200px) rotateY(7deg) translateX(-22px); }
      100% { opacity: 1; transform: perspective(1200px) rotateY(0deg) translateX(0); }
    }

    .reader-subhead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px 6px 20px;
      font-size: 11.5px;
      color: var(--paper-sub);
      flex-shrink: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    .reader-scroll {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 10px 22px 28px 22px;
    }

    .para-block {
      margin-bottom: 18px;
      position: relative;
    }

    .para-orig {
      font-family: var(--read-orig);
      font-size: calc(var(--reader-size) - 1.5px);
      line-height: 1.85;
      letter-spacing: 0.04em;
      color: var(--paper-sub);
      padding: 8px 11px;
      border-left: 2.5px solid var(--brand-tint);
      background: var(--accent-soft);
      border-radius: 0 8px 8px 0;
      margin: 0 0 8px 0;
    }

    .para-modern {
      font-family: var(--read-modern);
      font-size: var(--reader-size);
      line-height: 1.92;
      color: var(--paper-ink);
      margin: 0;
    }

    .reader-foot {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 20px 8px 20px;
      font-size: 11.5px;
      color: var(--paper-sub);
      border-top: 1px solid var(--paper-border);
      user-select: none;
      -webkit-user-select: none;
    }

    .reader-paper-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 16px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .reader-paper-bar.open {
      display: flex;
    }

    .swatch-row {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .swatch {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid var(--border-strong);
      cursor: pointer;
    }

    .swatch.active {
      border-color: var(--brand-tint);
      transform: scale(1.12);
    }

    .translating-box {
      padding: 64px 20px;
      text-align: center;
      color: var(--paper-sub);
      font-size: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .dot-pulse {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--brand-tint);
      animation: pulse 1.1s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(0.75); opacity: 0.4; }
      50% { transform: scale(1.3); opacity: 1; }
    }

    .ai-dock {
      flex-shrink: 0;
      padding: 8px 14px calc(10px + env(safe-area-inset-bottom)) 14px;
      background: var(--bg-glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
      z-index: 25;
    }

    .ai-pill-bar {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: 26px;
      padding: 5px 6px 5px 14px;
      box-shadow: var(--shadow-sm);
    }

    .ai-pill-input {
      flex: 1;
      min-width: 0;
      border: none;
      background: transparent;
      color: var(--ink);
      font-size: 15.5px;
      outline: none;
      padding: 6px 0;
      font-family: var(--font-sans);
    }

    .ai-pill-input::placeholder {
      color: var(--ink-faint);
      font-size: 13.5px;
    }

    .ai-pill-btn {
      appearance: none;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--accent);
      color: var(--accent-ink);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .ai-pill-history {
      appearance: none;
      border: none;
      background: var(--bg-subtle);
      color: var(--ink-sub);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 999px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .sel-float {
      position: fixed;
      left: 50%;
      bottom: calc(74px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 45;
      display: none;
      align-items: center;
      gap: 8px;
      background: var(--accent);
      color: var(--accent-ink);
      padding: 7px 10px;
      border-radius: 999px;
      box-shadow: var(--shadow-md);
    }

    .sel-float.show {
      display: inline-flex;
    }

    .sel-float button {
      appearance: none;
      border: none;
      background: transparent;
      color: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 3px 8px;
      cursor: pointer;
    }

    .sheet-mask {
      position: fixed;
      inset: 0;
      background: var(--mask);
      z-index: 60;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .sheet-mask.open {
      display: flex;
    }

    .sheet {
      width: 100%;
      max-width: 720px;
      max-height: 88dvh;
      background: var(--bg-app);
      border-radius: 20px 20px 0 0;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .sheet-chat {
      height: 86dvh;
    }

    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 16px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .sheet-title {
      font-family: var(--font-serif);
      font-size: 16.5px;
      font-weight: 700;
      color: var(--ink);
    }

    .sheet-sub {
      font-size: 11.5px;
      color: var(--ink-sub);
      margin-top: 2px;
    }

    .sheet-body {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bubble {
      max-width: 92%;
      padding: 12px 14px;
      border-radius: 16px;
      font-size: 14.5px;
      line-height: 1.78;
      word-break: break-word;
    }

    .bubble-user {
      align-self: flex-end;
      background: var(--accent);
      color: var(--accent-ink);
      border-bottom-right-radius: 5px;
    }

    .bubble-ai {
      align-self: flex-start;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--ink);
      border-bottom-left-radius: 5px;
      box-shadow: var(--shadow-sm);
    }

    .bubble-meta {
      font-size: 11px;
      color: var(--brand-tint);
      background: var(--brand-soft);
      display: inline-block;
      padding: 3px 9px;
      border-radius: 999px;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .bubble-h {
      font-family: var(--font-serif);
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
      margin: 10px 0 4px 0;
    }

    .bubble-h:first-child {
      margin-top: 0;
    }

    .bubble-p {
      margin: 0 0 6px 0;
      white-space: pre-wrap;
    }

    .cite-chip {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--brand-tint);
      background: var(--brand-soft);
      color: var(--brand-tint);
      font-size: 12px;
      font-weight: 600;
      padding: 1px 7px;
      border-radius: 6px;
      margin: 0 2px;
      cursor: pointer;
      vertical-align: baseline;
    }

    .bubble-foot {
      margin-top: 8px;
      padding-top: 7px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
    }

    .mini-link-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--ink-sub);
      font-size: 11.5px;
      padding: 2px 0;
      cursor: pointer;
    }

    .chip-strip {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 8px 14px 4px 14px;
      scrollbar-width: none;
      flex-shrink: 0;
    }

    .chip-strip::-webkit-scrollbar {
      display: none;
    }

    .quick-chip {
      flex-shrink: 0;
      appearance: none;
      border: 1px solid var(--border-strong);
      background: var(--bg-surface);
      color: var(--ink-sub);
      font-size: 12px;
      padding: 6px 11px;
      border-radius: 999px;
      cursor: pointer;
    }

    .btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--ink);
      font-size: 13px;
      font-weight: 500;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
    }

    .btn-soft {
      background: var(--brand-soft);
      border-color: transparent;
      color: var(--brand-tint);
      font-weight: 600;
    }

    .btn-danger {
      background: var(--danger-soft);
      border-color: transparent;
      color: var(--danger);
      font-weight: 600;
    }

    .toc-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 6px;
      border-bottom: 1px solid var(--border);
    }

    .toc-link {
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }

    .toc-title {
      font-family: var(--font-serif);
      font-size: 15px;
      font-weight: 600;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toc-row.current .toc-title {
      color: var(--brand-tint);
      font-weight: 700;
    }

    .toc-pg {
      font-size: 11.5px;
      color: var(--ink-faint);
      margin-top: 2px;
    }

    .set-block {
      margin-bottom: 20px;
    }

    .set-label {
      display: block;
      font-size: 13.5px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--ink);
    }

    .set-hint {
      font-size: 12px;
      color: var(--ink-sub);
      margin-top: 6px;
      line-height: 1.6;
    }

    .seg-grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .seg-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .seg-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }

    .seg-item {
      appearance: none;
      border: 1px solid var(--border-strong);
      background: var(--bg-surface);
      color: var(--ink);
      padding: 9px 6px;
      border-radius: 10px;
      font-size: 13px;
      cursor: pointer;
      text-align: center;
    }

    .seg-item.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      font-weight: 700;
    }

    .key-input {
      flex: 1;
      border: 1px solid var(--border-strong);
      background: var(--bg-surface);
      color: var(--ink);
      font-size: 15px;
      padding: 9px 12px;
      border-radius: 10px;
      outline: none;
      font-family: monospace;
    }

    .progress-banner {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 80;
      display: none;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: calc(10px + env(safe-area-inset-top)) 16px 12px 16px;
      font-size: 12.5px;
      color: var(--ink-sub);
      box-shadow: var(--shadow-md);
    }

    .progress-banner.show {
      display: block;
    }

    .toast {
      position: fixed;
      left: 50%;
      top: calc(18px + env(safe-area-inset-top));
      transform: translateX(-50%);
      background: rgba(24, 24, 27, 0.92);
      color: #FFFFFF;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      z-index: 95;
      display: none;
      max-width: 88vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toast.show {
      display: block;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="progress-banner" id="progressBanner">
    <div id="progressText">正在处理...</div>
    <div class="prog-track" style="margin-top:8px;">
      <div class="prog-fill" id="progressFill" style="width:0%;"></div>
    </div>
  </div>

  <!-- 视图一：书架与知识库首页 -->
  <section class="view active" id="homeView">
    <header class="home-header">
      <div class="home-top-row">
        <div class="brand-title">藏往</div>
        <div class="icon-actions">
          <button type="button" class="icon-btn icon-btn-primary" id="addBookBtn" title="导入 PDF">+</button>
          <button type="button" class="icon-btn" id="openSettingsBtn" title="设置">&#9881;</button>
        </div>
      </div>

      <nav class="cat-strip" id="catStrip" aria-label="门类切换"></nav>

      <div class="sub-tabs">
        <button type="button" class="sub-tab active" data-sub="shelf" id="tabShelf">书架</button>
        <button type="button" class="sub-tab" data-sub="kb" id="tabKb">知识库</button>
        <button type="button" class="sub-tab" data-sub="notes" id="tabNotes">铁律摘录</button>
      </div>
    </header>

    <div class="home-scroll" id="homeScroll"></div>
  </section>

  <!-- 视图二：仿真翻页阅读器 -->
  <section class="view" id="readerView">
    <header class="reader-bar">
      <button type="button" class="reader-chip-btn" id="backHomeBtn">&#8592; 书架</button>
      <div class="mode-switch" role="tablist">
        <button type="button" class="mode-btn active" id="modeModernBtn">纯现代文</button>
        <button type="button" class="mode-btn" id="modeDualBtn">古今对照</button>
      </div>
      <div style="display:flex; gap:5px;">
        <button type="button" class="reader-chip-btn" id="openTocBtn">目录</button>
        <button type="button" class="reader-chip-btn" id="togglePaperBarBtn">纸色</button>
        <button type="button" class="reader-chip-btn" id="speakBtn">听书</button>
      </div>
    </header>

    <div class="reader-paper-bar" id="readerPaperBar">
      <div class="swatch-row" id="paperSwatchRow">
        <button type="button" class="swatch" data-paper="pure-white" style="background:#FFFFFF;" title="极净白"></button>
        <button type="button" class="swatch" data-paper="mist-gray" style="background:#F2F2F5;" title="柔雾灰"></button>
        <button type="button" class="swatch" data-paper="soft-beige" style="background:#F6F2E8;" title="护眼淡米"></button>
        <button type="button" class="swatch" data-paper="tea-green" style="background:#E9F1E8;" title="清茶淡绿"></button>
        <button type="button" class="swatch" data-paper="charcoal" style="background:#161618;" title="深夜炭黑"></button>
      </div>
      <button type="button" class="btn" id="readerFontBtn" style="padding:6px 10px; font-size:12px;">字体与设置</button>
    </div>

    <div class="reader-stage" id="readerStage">
      <article class="reader-leaf" id="readerLeaf">
        <div class="reader-subhead">
          <span id="readerChapterLabel">卷首</span>
          <span id="readerBookLabel">典籍</span>
        </div>
        <div class="reader-scroll" id="readerScroll"></div>
        <div class="reader-foot">
          <span id="readerHintLeft">左右滑动翻页</span>
          <span id="readerPageLabel">第 1 / 1 页</span>
        </div>
      </article>
    </div>
  </section>

  <!-- 划词快捷条 -->
  <div class="sel-float" id="selFloat">
    <button type="button" id="selAskBtn">问书童这段</button>
    <span style="opacity:0.35;">|</span>
    <button type="button" id="selNoteBtn">存铁律</button>
  </div>

  <!-- 底部 GPT / Gemini 风格长条主控 AI 输入框（全局常驻） -->
  <footer class="ai-dock">
    <div class="ai-pill-bar">
      <button type="button" class="ai-pill-history" id="openChatSheetBtn">对话</button>
      <input type="text" class="ai-pill-input" id="dockInput" placeholder="问当前门类所有书，支持口语或错字自动理解..." enterkeyhint="send">
      <button type="button" class="ai-pill-btn" id="dockSendBtn" aria-label="发送">&#8593;</button>
    </div>
  </footer>

  <input type="file" id="pdfInput" class="hidden" accept=".pdf,application/pdf" multiple>
  <input type="file" id="backupInput" class="hidden" accept=".json,application/json">

  <!-- 主控 AI 对话抽屉 -->
  <div class="sheet-mask" id="chatMask">
    <div class="sheet sheet-chat" role="dialog" aria-modal="true">
      <div class="sheet-head">
        <div>
          <div class="sheet-title" id="chatTitle">随身书童</div>
          <div class="sheet-sub" id="chatSub">跨当前门类全部典籍联合检索 · 出处点击直达原书</div>
        </div>
        <div style="display:flex; gap:8px;">
          <button type="button" class="btn" id="clearChatBtn">清空</button>
          <button type="button" class="btn" id="closeChatBtn">收起</button>
        </div>
      </div>

      <div class="chat-messages" id="chatMessages"></div>

      <div class="chip-strip" id="quickChips">
        <button type="button" class="quick-chip" data-q="用大白话总结我当前正在看的这一页重点">总结当前页</button>
        <button type="button" class="quick-chip" data-q="对比当前门类里几本书的核心异同，做个对照表">跨书观点对照</button>
        <button type="button" class="quick-chip" data-q="帮我翻到下一页并转成现代文">翻到下一页</button>
        <button type="button" class="quick-chip" data-q="按我书架里的书，讲讲实战中最容易踩坑的反转铁律">实战铁律盘点</button>
      </div>

      <div style="padding:8px 14px 10px 14px; background:var(--bg-surface); border-top:1px solid var(--border);">
        <div class="ai-pill-bar">
          <input type="text" class="ai-pill-input" id="sheetChatInput" placeholder="继续追问、跨书对照、或直接发盘面按书断案..." enterkeyhint="send">
          <button type="button" class="ai-pill-btn" id="sheetChatSendBtn">&#8593;</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 章节目录与一键提炼表格抽屉 -->
  <div class="sheet-mask" id="tocMask">
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-head">
        <div>
          <div class="sheet-title" id="tocTitle">章节目录</div>
          <div class="sheet-sub" id="tocSub">点击章名跳页，点右侧可一键提炼本章知识表</div>
        </div>
        <button type="button" class="btn" id="closeTocBtn">关闭</button>
      </div>
      <div class="sheet-body" id="tocList"></div>
    </div>
  </div>

  <!-- 设置抽屉（外观皮肤、纸色、字体、API Key、备份恢复） -->
  <div class="sheet-mask" id="settingsMask">
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-head">
        <div>
          <div class="sheet-title">书房设置</div>
          <div class="sheet-sub">所有配置、书籍与白话译文均永久保存于本机</div>
        </div>
        <button type="button" class="btn btn-primary" id="closeSettingsBtn">完成</button>
      </div>
      <div class="sheet-body">
        <div class="set-block">
          <label class="set-label" for="apiKeyInput">DeepSeek API Key</label>
          <div style="display:flex; gap:8px;">
            <input type="password" id="apiKeyInput" class="key-input" placeholder="sk-..." autocomplete="off" spellcheck="false">
            <button type="button" class="btn" id="toggleKeyBtn">显示</button>
            <button type="button" class="btn btn-primary" id="saveKeyBtn">保存</button>
          </div>
          <div class="set-hint">直连 DeepSeek 官方接口，仅存于本机浏览器中。</div>
        </div>

        <div class="set-block">
          <label class="set-label">AI 智能引擎</label>
          <div class="seg-grid-3" id="modelSeg">
            <button type="button" class="seg-item" data-model="deepseek-flash">V4.1 Flash</button>
            <button type="button" class="seg-item" data-model="deepseek-chat">Chat 通用</button>
            <button type="button" class="seg-item" data-model="deepseek-reasoner">R1 深度</button>
          </div>
        </div>

        <div class="set-block">
          <label class="set-label">界面风格皮肤</label>
          <div class="seg-grid-2" id="skinSeg">
            <button type="button" class="seg-item" data-skin="porcelain">极简瓷白</button>
            <button type="button" class="seg-item" data-skin="celadon">月白青瓷</button>
            <button type="button" class="seg-item" data-skin="jade">暖玉轻奢</button>
            <button type="button" class="seg-item" data-skin="obsidian">暗夜曜石</button>
          </div>
        </div>

        <div class="set-block">
          <label class="set-label">看书页面纸色</label>
          <div class="seg-grid-3" id="paperSeg">
            <button type="button" class="seg-item" data-paper="pure-white">极净白</button>
            <button type="button" class="seg-item" data-paper="mist-gray">柔雾灰</button>
            <button type="button" class="seg-item" data-paper="soft-beige">护眼淡米</button>
            <button type="button" class="seg-item" data-paper="tea-green">清茶淡绿</button>
            <button type="button" class="seg-item" data-paper="charcoal">深夜炭黑</button>
          </div>
        </div>

        <div class="set-block">
          <label class="set-label">阅读字体风格</label>
          <div class="seg-grid-2" id="fontSeg">
            <button type="button" class="seg-item" data-font="mixed">宋黑雅致（推荐）</button>
            <button type="button" class="seg-item" data-font="serif">经典宋体</button>
            <button type="button" class="seg-item" data-font="sans">现代黑体</button>
            <button type="button" class="seg-item" data-font="kai">雅致楷体</button>
          </div>
        </div>

        <div class="set-block">

      // IndexedDB 持久化
      function openDB() {
        if (db) return Promise.resolve(db);
        return new Promise((resolve, reject) => {
          const req = indexedDB.open(DB_NAME, DB_VER);
          req.onupgradeneeded = (e) => {
            const d = e.target.result;
            if (!d.objectStoreNames.contains(ST_BOOKS)) d.createObjectStore(ST_BOOKS, { keyPath: 'id' });
            if (!d.objectStoreNames.contains(ST_NOTES)) d.createObjectStore(ST_NOTES, { keyPath: 'id' });
          };
          req.onsuccess = () => { db = req.result; resolve(db); };
          req.onerror = () => reject(req.error);
        });
      }

      async function dbGetAll(store) {
        const d = await openDB();
        return new Promise((resolve, reject) => {
          const tx = d.transaction(store, 'readonly');
          const req = tx.objectStore(store).getAll();
          req.onsuccess = () => resolve((req.result || []).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)));
          req.onerror = () => reject(req.error);
        });
      }

      async function dbPut(store, item) {
        const d = await openDB();
        return new Promise((resolve, reject) => {

          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
        });
      }

      async function dbDel(store, id) {

      // PDF 章节提取与清洗
      function extractChapters(pages) {
        const raw = [];
        const re = /^(第[一二三四五六七八九十百千万0-9]+[卷篇章回节部]|卷[一二三四五六七八九十百0-9]+|[一二三四五六七八九十]+、|【[^】]{2,20}】|[^\s。！？；：]{2,14}(?:篇|章|论|诀|赋|歌|说))$/;
        for (let i = 0; i < pages.length; i++) {
          const lines = pages[i].text.split('\n').map(s => s.trim()).filter(Boolean);
          for (let j = 0; j < Math.min(6, lines.length); j++) {
            const ln = lines[j];
            if (ln.length >= 2 && ln.length <= 24 && re.test(ln)) {
              if (raw.length === 0 || raw[raw.length - 1].title !== ln) {
                raw.push({ id: 'ch_' + i, title: ln, pageIdx: i, endPageIdx: i, summaryTable: null });
              }
              break;
            }
          }
        }
        if (raw.length < 2) {
          raw.length = 0;
          for (let i = 0; i < pages.length; i += 10) {
            const end = Math.min(pages.length - 1, i + 9);
            raw.push({ id: 'ch_' + i, title: '第 ' + (i + 1) + ' - ' + (end + 1) + ' 页', pageIdx: i, endPageIdx: end, summaryTable: null });
          }
        } else {
          for (let i = 0; i < raw.length; i++) {
            raw[i].endPageIdx = i + 1 < raw.length ? Math.max(raw[i].pageIdx, raw[i + 1].pageIdx - 1) : pages.length - 1;
          }
        }
        return raw;
      }

      function chapterOfPage(book, idx) {
        if (!book || !book.chapters || book.chapters.length === 0) return '正文';
        let title = book.chapters[0].title;
        for (const ch of book.chapters) {
          if (ch.pageIdx <= idx) title = ch.title;
          else break;
        }
        return title;
      }

      function cleanCn(str) {
        let s = str.replace(/\s+/g, ' ').trim();
        s = s.replace(/([\u4e00-\u9fff\u3000-\u303f\uff00-\uffef])\s+([\u4e00-\u9fff\u3000-\u303f\uff00-\uffef])/g, '$1$2');
        s = s.replace(/([\u4e00-\u9fff\u3000-\u303f\uff00-\uffef])\s+([\u4e00-\u9fff\u3000-\u303f\uff00-\uffef])/g, '$1$2');
        return s;
      }

      async function parsePdf(file, idx, total) {
        const buf = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({
          data: new Uint8Array(buf),
          cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',
          cMapPacked: true
        }).promise;
        const num = pdf.numPages;
        const pages = [];
        let totalChars = 0;
        const title = file.name.replace(/\.pdf$/i, '').trim() || '未命名古籍';

        for (let p = 1; p <= num; p++) {
          const pct = Math.max(4, Math.min(99, Math.floor((p / num) / 0.01)));
          el.progressText.textContent = '正在解析' + (total > 1 ? '(' + (idx + 1) + '/' + total + ')' : '') + '《' + title + '》 第 ' + p + '/' + num + ' 页';
          el.progressFill.style.width = pct + '%';

          const page = await pdf.getPage(p);
          const content = await page.getTextContent();
          const lines = [];
          let cur = '';
          let lastY = null;

          for (const item of content.items) {
            const str = item.str || '';
            if (!str) continue;
            const y = item.transform ? item.transform[5] : 0;
            const h = item.height || 12;
            if (lastY !== null && Math.abs(y - lastY) > h / 1.4) {
              const c = cleanCn(cur);
              if (c) lines.push(c);
              cur = str;
            } else {
              cur += str;
            }
            lastY = y;
            if (item.hasEOL) {
              const c = cleanCn(cur);
              if (c) lines.push(c);
              cur = '';
              lastY = null;
            }
          }
          if (cur.trim()) {
            const c = cleanCn(cur);
            if (c) lines.push(c);
          }

          const merged = [];
          for (const ln of lines) {
            if (
              merged.length > 0 &&
              merged[merged.length - 1].length > 18 &&
              !/[。！？；：”」』】]$/.test(merged[merged.length - 1]) &&
              !/^(第[一二三四五六七八九十百千万0-9]+[卷篇章回节]|卷[一二三四五六七八九十0-9]+)/.test(ln)
            ) {
              merged[merged.length - 1] += ln;
            } else {
              merged.push(ln);
            }
          }
          const txt = merged.join('\n');
          totalChars += txt.length;
          pages.push({ pageNum: p, text: txt, vernacular: null });
        }

        if (totalChars < 20) throw new Error('《' + title + '》未提取到文字（可能是纯图片扫描 PDF）');

        return {
          id: 'bk_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
          category: activeCat,
          title,
          coverBg: hashCover(title),
          pages,
          chapters: extractChapters(pages),
          totalChars,
          lastPageIdx: 0,
          createdAt: Date.now() + idx
        };
      }

      async function handleImport(files) {
        if (!window.pdfjsLib) { toast('PDF 组件未就绪，请检查网络'); return; }
        const arr = Array.from(files || []);
        if (arr.length === 0) return;

        el.progressBanner.classList.add('show');
        el.progressFill.style.width = '5%';
        let ok = 0;
        let last = null;
        try {
          for (let i = 0; i < arr.length; i++) {
            try {
              const book = await parsePdf(arr[i], i, arr.length);
              el.progressText.textContent = '正在永久写入本机书房...';
              el.progressFill.style.width = '100%';
              await dbPut(ST_BOOKS, book);
              allBooks.unshift(book);
              last = book;
              ok++;
            } catch (e) {
              toast(e.message || '导入失败');
            }
          }
          if (last) {
            recentMap[activeCat] = last.id;

      // DeepSeek 官方直连接口（自动兼容 deepseek-flash 回退 deepseek-chat）
      async function callDeepSeek(messages, opts) {
        const key = getApiKey();
        if (!key) throw new Error('NO_KEY');
        const stream = Boolean(opts && opts.stream);
        const onChunk = opts && opts.onChunk;
        const signal = opts && opts.signal;
        const temp = opts && typeof opts.temperature === 'number' ? opts.temperature : 0.35;

        const chosen = getModel();
        const models = chosen === 'deepseek-flash' ? ['deepseek-flash', 'deepseek-chat'] : [chosen];

        let lastErr = null;
        for (const m of models) {
          try {
            const payload = { model: m, messages, stream };
            if (m !== 'deepseek-reasoner') payload.temperature = temp;
            const res = await fetch(DEEPSEEK_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
              body: JSON.stringify(payload),
              signal
            });
            if (!res.ok) {
              const errTxt = await res.text().catch(() => '');
              if (res.status === 401) throw new Error('API Key 无效，请在设置中核对');
              if (res.status === 402) throw new Error('DeepSeek 账户余额不足');
              lastErr = new Error('接口状态 ' + res.status + '：' + errTxt.slice(0, 100));
              continue;
            }
            if (!stream) {
              const j = await res.json();
              return (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '';
            }
            const reader = res.body.getReader();
            const decoder = new TextDecoder('utf-8');
            let buf = '';
            let full = '';
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              buf += decoder.decode(value, { stream: true });
              const lines = buf.split('\n');
              buf = lines.pop() || '';
              for (const raw of lines) {
                const ln = raw.trim();
                if (!ln || !ln.startsWith('data:')) continue;
                const dStr = ln.replace(/^data:\s{0,}/, '');
                if (dStr === '[DONE]') break;
                try {
                  const j = JSON.parse(dStr);
                  const delta = j.choices && j.choices[0] && j.choices[0].delta;
                  if (delta && delta.content) {
                    full += delta.content;
                    if (onChunk) onChunk(full);
                  }
                } catch (e) {}
              }
            }
            return full;
          } catch (e) {
            if (e.name === 'AbortError') throw e;
            lastErr = e;
            if (e.message && (e.message.includes('无效') || e.message.includes('余额'))) throw e;
          }
        }
        throw lastErr || new Error('网络连接异常');
      }

      // 单页古文逐段转现代白话（永久缓存于 IndexedDB）
      async function translatePage(book, pageIdx, bg) {
        if (!book || pageIdx < 0 || pageIdx >= book.pages.length) return null;
        const page = book.pages[pageIdx];
        if (!page.text || !page.text.trim()) {
          page.vernacular = ['（本页无文本内容）'];
          return page.vernacular;
        }
        if (Array.isArray(page.vernacular) && page.vernacular.length > 0) return page.vernacular;

        const key = book.id + ':' + pageIdx;
        if (translatingKeys.has(key)) return null;
        translatingKeys.add(key);

        try {
          const origParas = page.text.split('\n').map(s => s.trim()).filter(Boolean);
          const numbered = origParas.map((p, i) => '[' + (i + 1) + '] ' + p).join('\n');
          const catObj = getCat(book.category);

          const out = await callDeepSeek([
            {
              role: 'system',
              content:
                '你是精通' + catObj.full + '的现代白话翻译名家。请把用户发来的古文段落，严格逐段翻译成通俗好懂的现代白话文。\n' +
                '1. 每段严格以 [1]、[2] 开头，与原文段数完全一一对应。\n' +
                '2. 遇到术数术语或省略主语处，自然补充人话解释，让普通人一眼读懂。\n' +
                '3. 禁止寒暄，禁止使用星号符号，直接输出编号译文。'
            },
            { role: 'user', content: '《' + book.title + '》第' + page.pageNum + '页：\n\n' + numbered }
          ], { stream: false, temperature: 0.25 });

          const parsed = new Array(origParas.length).fill('');
          let cur = -1;
          for (const ln of out.split('\n').map(s => s.trim()).filter(Boolean)) {
            const m = ln.match(/^\[(\d+)\]\s{0,}(.{0,})$/);
            if (m) {
              const n = parseInt(m[1], 10) - 1;
              if (n >= 0 && n < origParas.length) {
                cur = n;
                parsed[cur] = m[2];
                continue;
              }
            }
            if (cur >= 0 && cur < origParas.length) {
              parsed[cur] += (parsed[cur] ? ' ' : '') + ln;
            }
          }
          for (let i = 0; i < origParas.length; i++) {
            if (!parsed[i]) parsed[i] = origParas[i];
          }
          page.vernacular = parsed;
          await dbPut(ST_BOOKS, book);
          return parsed;
        } catch (e) {
          if (!bg && e.message === 'NO_KEY') return 'NO_KEY';
          return null;
        } finally {
          translatingKeys.delete(key);
        }
      }

      // 一键提炼单章结构化知识表（古文原典 + 现代白话 + 铁律反转）
      async function extractChapterTable(book, chapIdx) {
        if (!getApiKey()) {
          toast('请先在设置中填写 DeepSeek API Key');
          openSettings();
          return;
        }
        const ch = book.chapters[chapIdx];
        if (!ch) return;

        el.progressBanner.classList.add('show');
        el.progressText.textContent = '正在精读《' + book.title + '》' + ch.title + '，整理知识表格...';
        el.progressFill.style.width = '45%';

        try {
          let textChunk = '';
          for (let p = ch.pageIdx; p <= ch.endPageIdx; p++) {
            if (!book.pages[p]) break;
            const add = '【第' + book.pages[p].pageNum + '页】\n' + book.pages[p].text + '\n\n';
            if (textChunk.length + add.length > 16000) break;
            textChunk += add;
          }

          const catObj = getCat(book.category);
          const raw = await callDeepSeek([
            {
              role: 'system',
              content:
                '你是精通' + catObj.full + '的典籍整理专家。请把下方这一章的古籍原文，提炼成一张清晰好懂的结构化知识总结表。\n' +
                '要求：\n' +
                '1. 必须仅输出合法 JSON（不要代码块标记，不要多余文字，严禁使用星号符号）。\n' +
                '2. JSON 格式：{"columns":["核心知识点","古文原典","现代白话翻译","铁律与例外反转"],"rows":[["知识点名称","摘录关键古文原句（附页码）","通俗直白的大白话翻译","成立前提、核心断语或反转特例"]]}\n' +
                '3. 如果本章讲的是六十四卦等具体象义，第一列可写“卦名/条目”，每条务必同时保留古文原典和现代白话翻译，整理 4 到 12 条最精华的重点。'
            },
            { role: 'user', content: '典籍：《' + book.title + '》 章节：' + ch.title + '\n\n' + textChunk }
          ], { stream: false, temperature: 0.2 });

          el.progressFill.style.width = '90%';
          const jsonMatch = raw.match(/\{[\s\S]{0,}\}/);
          let tableObj = null;
          if (jsonMatch) {
            const parsed = JSON.parse(jsonMatch[0]);
            if (Array.isArray(parsed.columns) && Array.isArray(parsed.rows) && parsed.rows.length > 0) {
              tableObj = parsed;
            }
          }
          if (!tableObj) {
            tableObj = {
              columns: ['章节精华整理'],
              rows: [[raw.trim()]]
            };
          }

          ch.summaryTable = tableObj;
          await dbPut(ST_BOOKS, book);
          toast('「' + ch.title + '」重点表已存入知识库');

          if (homeSubTab === 'kb') renderHome();
          if (el.tocMask.classList.contains('open')) renderToc();
        } catch (e) {
          toast('提炼失败：' + (e.message || '请稍后重试'));
        } finally {
          el.progressFill.style.width = '100%';
          setTimeout(() => el.progressBanner.classList.remove('show'), 250);
        }
      }

      async function saveNote(content, bookTitle, pageNum) {
        const note = {
          id: 'nt_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
          category: activeCat,
          bookTitle: bookTitle || '',
          pageNum: pageNum || 0,
          content: content.trim(),
          createdAt: Date.now()
        };
        await dbPut(ST_NOTES, note);
        allNotes.unshift(note);
        toast('已收进「' + getCat(activeCat).name + '」铁律摘录本');
      }

      // 打开仿真阅读器
      async function openReader(book, pageIdx, flipDir) {
        if (!book) return;
        currentBook = book;
        activeCat = book.category;
        localStorage.setItem(LS.cat, activeCat);
        recentMap[activeCat] = book.id;
        saveRecentMap();

        el.homeView.classList.remove('active');
        el.readerView.classList.add('active');
        applyReadModeUI();
        await renderReaderPage(book, pageIdx, flipDir || null);
      }

      function closeReader() {
        stopSpeak();
        el.selFloat.classList.remove('show');
        el.readerPaperBar.classList.remove('open');
        el.readerView.classList.remove('active');
        el.homeView.classList.add('active');
        renderHome();
      }

      async function renderReaderPage(book, idx, flipDir) {
        const myTicket = ++renderTicket;
        const total = book.pages.length;
        currentPageIdx = Math.min(Math.max(0, idx), total - 1);
        book.lastPageIdx = currentPageIdx;
        dbPut(ST_BOOKS, book).catch(() => {});

        el.selFloat.classList.remove('show');
        if (flipDir) {
          el.readerLeaf.classList.remove('flip-next', 'flip-prev');
          void el.readerLeaf.offsetWidth;
          el.readerLeaf.classList.add(flipDir === 'next' ? 'flip-next' : 'flip-prev');
        }

        el.readerChapterLabel.textContent = chapterOfPage(book, currentPageIdx);
        el.readerBookLabel.textContent = '《' + book.title + '》';
        el.readerPageLabel.textContent = '第 ' + (currentPageIdx + 1) + ' / ' + total + ' 页';
        el.readerScroll.scrollTop = 0;

        const page = book.pages[currentPageIdx];
        const origParas = page.text.split('\n').map(s => s.trim()).filter(Boolean);

        if (Array.isArray(page.vernacular) && page.vernacular.length > 0) {
          paintPageParas(origParas, page.vernacular);
          prefetchNext(book, currentPageIdx);
          return;
        }

        if (!getApiKey()) {
          paintPageParas(origParas, null, '尚未填写 DeepSeek API Key，暂以原典展示（点击右上角设置填入即可自动转为现代白话文）');
          return;
        }

        el.readerScroll.innerHTML =
          '<div class="translating-box"><div class="dot-pulse"></div><div>正在将第 ' + (currentPageIdx + 1) + ' 页古文译为流畅现代文...</div></div>';

        const vern = await translatePage(book, currentPageIdx, false);
        if (myTicket !== renderTicket) return;

        if (Array.isArray(vern)) {
          paintPageParas(origParas, vern);
          prefetchNext(book, currentPageIdx);
        } else {
          paintPageParas(origParas, null, '白话翻译暂未连通，已为您显示原典古文');
        }
      }

      function prefetchNext(book, idx) {
        if (!getApiKey()) return;
        setTimeout(() => {
          if (currentBook && currentBook.id === book.id && idx + 1 < book.pages.length) translatePage(book, idx + 1, true);
        }, 450);
        setTimeout(() => {
          if (currentBook && currentBook.id === book.id && idx + 2 < book.pages.length) translatePage(book, idx + 2, true);
        }, 1800);
      }

      function paintPageParas(origParas, vernParas, banner) {
        el.readerScroll.innerHTML = '';
        if (banner) {
          const tip = document.createElement('div');
          tip.style.fontSize = '12px';
          tip.style.color = 'var(--paper-sub)';
          tip.style.textAlign = 'center';
          tip.style.marginBottom = '16px';
          tip.textContent = banner;
          el.readerScroll.appendChild(tip);
        }
        if (origParas.length === 0) {
          const p = document.createElement('p');
          p.className = 'para-modern';
          p.style.textAlign = 'center';
          p.style.color = 'var(--paper-sub)';
          p.textContent = '（本页无文本）';
          el.readerScroll.appendChild(p);
          return;
        }

        const frag = document.createDocumentFragment();
        for (let i = 0; i < origParas.length; i++) {
          const block = document.createElement('div');
          block.className = 'para-block';

          if (readMode === 'dual' || !vernParas) {
            const pO = document.createElement('p');
            pO.className = 'para-orig';
            pO.textContent = origParas[i];
            block.appendChild(pO);
          }

          if (vernParas && vernParas[i]) {
            const pM = document.createElement('p');
            pM.className = 'para-modern';
            pM.textContent = vernParas[i];
            block.appendChild(pM);
          }
          frag.appendChild(block);
        }
        el.readerScroll.appendChild(frag);
      }

      function turnPage(delta) {
        if (!currentBook) return;
        const target = currentPageIdx + delta;
        if (target < 0) { toast('已是第一页'); return; }
        if (target >= currentBook.pages.length) { toast('已是最后一页'); return; }
        stopSpeak();
        renderReaderPage(currentBook, target, delta > 0 ? 'next' : 'prev');
      }

      // 智能体四步大脑：第一步（纠偏错别字 + 识别门类 + 看全库目录自主规划检索）
      function localFixTypos(q) {
        let s = q;
        for (const [wrong, right] of TYPO_FIXES) {
          if (s.includes(wrong)) s = s.split(wrong).join(right);
        }
        return s;
      }

      async function planQueryWithAI(rawQ, curCat) {
        const fixed = localFixTypos(rawQ);
        const catBooks = booksByCat(curCat);
        const allCatalog = CATEGORIES.map(c => {
          const bs = booksByCat(c.id);
          return c.id + '(' + c.name + ')：' + (bs.length > 0 ? bs.map(b => '《' + b.title + '》').join('、') : '无书');
        }).join('\n');

        const curTocSummary = catBooks.map(b =>
          '《' + b.title + '》目录：' + (b.chapters || []).slice(0, 22).map(ch => ch.title + '@' + (ch.pageIdx + 1) + '页').join('，')
        ).join('\n');

        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 6500);
        try {
          const res = await callDeepSeek([
            {
              role: 'system',
              content:
                '你是术数图书检索规划大脑。请分析用户提问，完成错别字纠偏（例如“刘遥”是“六爻”、“巡空”是“旬空”）、意图扩写、目标门类识别和目录定位。\n' +
                '必须仅输出一行合法 JSON（禁止代码块，禁止星号）：\n' +
                '{"corrected":"纠偏后的清晰问法","category":"liuyao或bazi或qimen或fengshui","keywords":["6到10个古籍里可能出现的等价专业词"],"chapterHits":[{"book":"书名","page":1}],"cmd":"NONE或NEXT_PAGE或PREV_PAGE或GOTO_PAGE:数字或MODE_MODERN或MODE_DUAL"}'
            },
            {
              role: 'user',
              content:
                '当前所在门类：' + curCat + '\n' +
                '全书房藏书：\n' + allCatalog + '\n' +
                '当前门类详细目录：\n' + (curTocSummary || '无') + '\n' +
                '用户原话：' + fixed
            }
          ], { stream: false, temperature: 0.1, signal: ctrl.signal });

          clearTimeout(timer);
          const m = res.match(/\{[\s\S]{0,}\}/);
          if (m) {
            const p = JSON.parse(m[0]);
            return {
              corrected: p.corrected || fixed,
              category: CATEGORIES.some(c => c.id === p.category) ? p.category : curCat,
              keywords: Array.isArray(p.keywords) ? p.keywords : [],
              chapterHits: Array.isArray(p.chapterHits) ? p.chapterHits : [],
              cmd: p.cmd || 'NONE'
            };
          }
        } catch (e) {
          clearTimeout(timer);
        }
        return { corrected: fixed, category: curCat, keywords: [], chapterHits: [], cmd: 'NONE' };
      }

      // 智能体第二步：跨目标门类全部书籍，结合目录命中 + 语义词扩召抓取整页原文
      function retrieveFromCategory(plan) {
        const catId = plan.category;
        const catBooks = booksByCat(catId);
        if (catBooks.length === 0) return { context: '', bookCount: 0 };

        const totalChars = catBooks.reduce((s, b) => s + (b.totalChars || 0), 0);
        if (totalChars <= 34000) {
          const full = catBooks.map(b =>
            b.pages.filter(p => p.text.trim()).map(p => '【《' + b.title + '》第' + p.pageNum + '页】\n' + p.text).join('\n\n')
          ).join('\n\n');
          return { context: full, bookCount: catBooks.length };
        }

        const terms = new Set();
        for (const kw of plan.keywords) {
          if (kw && kw.length >= 2) terms.add(kw);
        }
        const cleanQ = plan.corrected.replace(/[^\u4e00-\u9fffa-zA-Z0-9]/g, ' ').trim();
        for (const seg of cleanQ.split(/\s+/).filter(Boolean)) {
          if (seg.length >= 2) terms.add(seg);
          if (/^[\u4e00-\u9fff]+$/.test(seg)) {
            for (let len = 2; len <= 3; len++) {
              for (let i = 0; i <= seg.length - len; i++) terms.add(seg.slice(i, i + len));
            }
          }
        }

        for (const cl of (DOMAIN_LEXICON[catId] || [])) {
          if (cl.t.some(t => cleanQ.includes(t))) {
            cl.e.forEach(w => terms.add(w));
          }
        }
        const termArr = Array.from(terms);

        const pickedSet = new Set();
        const picked = [];
        let budget = 0;
        const MAX_BUDGET = 28000;

        // 优先纳入 AI 看目录点名的精准页码及下一页
        for (const hit of plan.chapterHits) {
          const b = catBooks.find(bk => bk.title.includes(hit.book) || (hit.book && hit.book.includes(bk.title)));
          if (!b) continue;
          const idx = Math.max(0, Math.min(b.pages.length - 1, (parseInt(hit.page, 10) || 1) - 1));
          for (const offset of [0, 1]) {
            const pIdx = idx + offset;
            if (pIdx < b.pages.length) {
              const k = b.id + ':' + pIdx;
              if (!pickedSet.has(k) && budget + b.pages[pIdx].text.length <= MAX_BUDGET) {
                pickedSet.add(k);
                picked.push({ book: b, pageIdx: pIdx });
                budget += b.pages[pIdx].text.length;
              }
            }
          }
        }

        // 全门类所有书籍跨书打分
        const scored = [];
        for (const b of catBooks) {
          for (let i = 0; i < b.pages.length; i++) {
            const txt = b.pages[i].text || '';
            if (!txt) continue;
            let sc = 0;
            let distinct = 0;
            for (const t of termArr) {
              let pos = txt.indexOf(t);
              if (pos !== -1) {
                distinct++;
                let cnt = 0;
                while (pos !== -1 && cnt < 4) { cnt++; pos = txt.indexOf(t, pos + t.length); }
                sc += Math.imul(cnt, t.length >= 3 ? 6 : 3);
              }
            }
            sc += Math.imul(distinct, 7);
            if (plan.corrected.includes(b.title)) sc += 15;
            if (sc > 0) scored.push({ book: b, pageIdx: i, sc });
          }
        }
        scored.sort((a, b) => b.sc - a.sc);

        for (const item of scored) {
          const k = item.book.id + ':' + item.pageIdx;
          if (pickedSet.has(k)) continue;
          const len = item.book.pages[item.pageIdx].text.length;
          if (budget + len > MAX_BUDGET && picked.length >= 6) break;
          pickedSet.add(k);
          picked.push({ book: item.book, pageIdx: item.pageIdx });
          budget += len;
        }

        if (picked.length === 0) {
          for (const b of catBooks) {
            if (b.pages[0]) picked.push({ book: b, pageIdx: 0 });
          }
        }

        picked.sort((a, b) => a.book.title.localeCompare(b.book.title) || a.pageIdx - b.pageIdx);
        const bookSet = new Set(picked.map(x => x.book.id));
        const ctx = picked.map(x => '【《' + x.book.title + '》第' + x.book.pages[x.pageIdx].pageNum + '页】\n' + x.book.pages[x.pageIdx].text).join('\n\n');
        return { context: ctx, bookCount: bookSet.size };
      }

      // 执行 AI 指挥指令
      async function runAgentCmd(cmd) {
        if (!cmd || cmd === 'NONE') return '';
        if (cmd === 'NEXT_PAGE' && currentBook) { turnPage(1); return '已为您翻到下一页'; }
        if (cmd === 'PREV_PAGE' && currentBook) { turnPage(-1); return '已为您翻回上一页'; }
        if (cmd.startsWith('GOTO_PAGE:') && currentBook) {
          const n = parseInt(cmd.split(':')[1], 10);
          if (n >= 1 && n <= currentBook.pages.length) {
            await renderReaderPage(currentBook, n - 1, 'next');
            return '已跳至第 ' + n + ' 页';
          }
        }
        if (cmd === 'MODE_MODERN') {
          readMode = 'modern';
          localStorage.setItem(LS.mode, readMode);
          applyReadModeUI();
          if (currentBook && el.readerView.classList.contains('active')) renderReaderPage(currentBook, currentPageIdx, null);
          return '已切换为纯现代文模式';
        }
        if (cmd === 'MODE_DUAL') {
          readMode = 'dual';
          localStorage.setItem(LS.mode, readMode);
          applyReadModeUI();
          if (currentBook && el.readerView.classList.contains('active')) renderReaderPage(currentBook, currentPageIdx, null);
          return '已切换为古今对照模式';
        }
        return '';
      }

      // 渲染带「可点击出处标签」的 AI 回复气泡
      function paintAiBubble(bubbleEl, msgObj) {
        bubbleEl.innerHTML = '';
        if (msgObj.meta) {
          const m = document.createElement('div');
          m.className = 'bubble-meta';
          m.textContent = msgObj.meta;
          bubbleEl.appendChild(m);
        }

        const lines = (msgObj.content || '').replace(/\r/g, '').split('\n');
        const citeRe = /《([^》]{1,40})》\s{0,}第\s{0,}(\d+)\s{0,}页/g;

        function appendRichLine(parent, text) {
          let last = 0;
          let match;
          citeRe.lastIndex = 0;
          while ((match = citeRe.exec(text)) !== null) {
            if (match.index > last) {
              parent.appendChild(document.createTextNode(text.slice(last, match.index)));
            }
            const bookName = match[1];
            const pageNum = parseInt(match[2], 10);
            const chip = document.createElement('button');
            chip.type = 'button';
            chip.className = 'cite-chip';
            chip.textContent = '《' + bookName + '》第' + pageNum + '页 ↗';
            chip.addEventListener('click', () => {
              const targetBook = allBooks.find(b => b.title === bookName || b.title.includes(bookName) || bookName.includes(b.title));
              if (targetBook) {
                el.chatMask.classList.remove('open');
                openReader(targetBook, Math.max(0, pageNum - 1), 'next');
              } else {
                toast('未在本地书架找到《' + bookName + '》');
              }
            });
            parent.appendChild(chip);
            last = match.index + match[0].length;
          }
          if (last < text.length) {
            parent.appendChild(document.createTextNode(text.slice(last)));
          }
        }

        for (const ln of lines) {
          const tr = ln.trim();
          if (!tr) continue;
          if (/^【[^】]{1,24}】$/.test(tr)) {
            const h = document.createElement('div');
            h.className = 'bubble-h';
            h.textContent = tr;
            bubbleEl.appendChild(h);
          } else {
            const p = document.createElement('p');
            p.className = 'bubble-p';
            appendRichLine(p, ln);
            bubbleEl.appendChild(p);
          }
        }

        if (msgObj.done && msgObj.content) {
          const foot = document.createElement('div');
          foot.className = 'bubble-foot';
          const favBtn = document.createElement('button');
          favBtn.type = 'button';
          favBtn.className = 'mini-link-btn';
          favBtn.textContent = '收藏到铁律摘录';
          favBtn.addEventListener('click', () => saveNote(msgObj.content, currentBook ? currentBook.title : '', currentBook ? currentPageIdx + 1 : 0));

          const copyBtn = document.createElement('button');
          copyBtn.type = 'button';
          copyBtn.className = 'mini-link-btn';
          copyBtn.textContent = '复制回答';
          copyBtn.addEventListener('click', async () => {
            try { await navigator.clipboard.writeText(msgObj.content); toast('已复制'); } catch (e) {}
          });

          foot.appendChild(favBtn);
          foot.appendChild(copyBtn);
          bubbleEl.appendChild(foot);
        }
      }
